  }
}

// Fetches forecast + AQI for a location and renders it. Shared by both the
// city-search path and the GPS path so there's one place talking to the
// weather APIs.
async function loadWeatherFor(lat,lon,name,locMeta){
  const wurl=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,weather_code,apparent_temperature,precipitation,surface_pressure,visibility,dew_point_2m,uv_index,is_day&hourly=temperature_2m,apparent_temperature,weather_code,precipitation_probability,precipitation&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,precipitation_probability_max,uv_index_max,precipitation_sum&timezone=auto&forecast_days=7&past_days=2&wind_speed_unit=kmh`;
  const aurl=`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${lat}&longitude=${lon}&current=us_aqi,pm10,pm2_5,carbon_monoxide,nitrogen_dioxide,ozone&timezone=auto`;
  const wd=await fT(wurl);
  let ad={};try{ad=await fT(aurl);}catch{}
  try{localStorage.setItem('vcache',JSON.stringify({name,lat,lon,wd,ad,locMeta,ts:Date.now()}));}catch{}
  LD=[name,lat,lon,wd,ad,locMeta];
  render(name,lat,lon,wd,ad,locMeta);
  document.getElementById('upd').textContent=`↻ Updated ${new Date().toLocaleTimeString()}`;
  updStar(name);
}

// ── MAIN FETCH ────────────────────────────────────────────────────────
function gpsProgressUI(){
  const el=document.getElementById('gpsProg');
  return acc=>{if(el)el.textContent=`Refining accuracy… current best ±${acc}m`;};
}
async function doFetch(cityOvr){
  const city=cityOvr||document.getElementById('ci').value.trim();
  setOut(`<div class="msg"><div class="spin"></div><br>${city?'Loading weather…':'Detecting your GPS location…'}<div id="gpsProg" style="font-size:.75rem;color:var(--mu);margin-top:6px"></div></div>`);
  document.getElementById('upd').textContent='';
  try{
    if(city){
      const results=await geocodeCity(city,1);
      if(!results.length)throw new Error('City not found. Try another name.');
      const name=`${results[0].name}, ${results[0].country_code}`;
      await loadWeatherFor(results[0].lat,results[0].lon,name,{source:'search'});
    }else{
      const loc=await locateMe(gpsProgressUI());
      await loadWeatherFor(loc.lat,loc.lon,loc.name,loc.locMeta);
    }
  }catch(e){
    try{
      const cached=JSON.parse(localStorage.getItem('vcache')||'{}');
      if(cached.wd){
        LD=[cached.name,cached.lat,cached.lon??0,cached.wd,cached.ad,cached.locMeta];
        render(cached.name,cached.lat,cached.lon??0,cached.wd,cached.ad,cached.locMeta);
        document.getElementById('upd').textContent=`📦 Cached · ${cached.ts?new Date(cached.ts).toLocaleTimeString():'–'}`;
        return;
      }
    }catch{}
    setOut(`<div class="msg">⚠️ ${e.message||'Could not load weather'}<br><small style="opacity:.6">Search a city above, or check your GPS/location permission.</small><br><br><button onclick="doRefresh()" style="margin-top:10px;background:var(--ac);color:#000;border:none;padding:10px 22px;border-radius:20px;font-size:.8rem;font-weight:700;cursor:pointer">↻ Retry</button><br><br><button onclick="useGPS()" style="margin-top:6px;background:var(--s2);color:var(--tx);border:1px solid var(--bd);padding:10px 22px;border-radius:20px;font-size:.8rem;cursor:pointer">📍 Retry GPS</button></div>`);
  }
}

async function useGPS(){
  setOut('<div class="msg"><div class="spin"></div><br>Getting your GPS location…<div id="gpsProg" style="font-size:.75rem;color:var(--mu);margin-top:6px"></div></div>');
  try{
    const loc=await locateMe(gpsProgressUI());
    await loadWeatherFor(loc.lat,loc.lon,loc.name,loc.locMeta);
  }catch(e){
    setOut(`<div class="msg">📍 ${e.message||'Could not get GPS location.'}<br><small style="opacity:.6">Search a city in the box above, or enable location in browser settings.</small><br><br><button onclick="useGPS()" style="margin-top:8px;background:var(--ac);color:#000;border:none;padding:10px 22px;border-radius:20px;font-size:.8rem;font-weight:700;cursor:pointer">↻ Try Again</button></div>`);
  }
}
function doRefresh(){doFetch(document.getElementById('ci').value.trim()||undefined);}
function goToMyLocation(){document.getElementById('ci').value='';hideSug();doFetch();}

// ── RENDER ────────────────────────────────────────────────────────────
function render(name,lat,lon,wd,ad,locMeta){
  const c=wd.current,d=wd.daily,h=wd.hourly,now=new Date();
  setBg(c.weather_code,c.is_day);
  if(locMeta?.source==='gps')locBanner();
  // Location source badge — tells the user how precise the detected location is
  let locBadge='';
  if(locMeta?.source==='gps'){
    const acc=locMeta.accuracy;
    const good=acc!=null&&acc<=50;
    locBadge=`<div style="font-size:.72rem;color:${good?'var(--gn)':'var(--mu)'};margin-top:2px">🎯 GPS${acc!=null?` · ±${acc}m`:''}${good?'':' · refine for better accuracy'}</div>`;
  }
  const dateStr=now.toLocaleDateString('en',{weekday:'long',day:'numeric',month:'short'});
  const pressure=Math.round(c.surface_pressure??1013);
  const vis=(Number(c.visibility??10000)/1000).toFixed(1);
  const dew=c.dew_point_2m??0;
  const uv=c.uv_index??0;
  const wdg=windDir(c.wind_direction_10m??0);
  // past_days=2 prepends 2 historical days to the daily array (needed for
  // Flash Flood Risk's "recent rainfall" input) — so index 0 is no longer
  // "today". Every daily-array lookup below must use todayIdx, not 0.
  const todayIdx=Math.max(0,d.time.findIndex(t=>new Date(t).toDateString()===now.toDateString()));
  const rise=d.sunrise?.[todayIdx],set=d.sunset?.[todayIdx];
  const moon=moonPhase();
  const isFav=gF().includes(name);

  // AQI (computed early — needed by emojiSummary below)
  const aqiOk=ad.current?.us_aqi!=null;
  const aqi=ad.current?.us_aqi??0;
  const pm25=Number(ad.current?.pm2_5??0),pm10=Number(ad.current?.pm10??0);
  const co=(Number(ad.current?.carbon_monoxide??0)/1000).toFixed(2);
  const no2=Number(ad.current?.nitrogen_dioxide??0).toFixed(1);
  const o3=Number(ad.current?.ozone??0).toFixed(1);

  // ── NEW FEATURES ──────────────────────────────────────────────────
  // Feature 16: Local city time
  const tzOff=wd.utc_offset_seconds??0;
  const localTime=cityTime(tzOff);

  // Feature 17: Emoji summary
  const emSum=emojiSummary(c.temperature_2m,c.weather_code,c.wind_speed_10m,c.precipitation,aqi,useF);

  // Feature 18: Feels-like badge
  const fb=feelsBadge(c.apparent_temperature);

  // Feature 11: Twilight times
  const tw=twilightTimes(rise,set);

  // Feature 24: Unit-aware speed/pressure/dist/rain
  const windSpd=applyUnits(c.wind_speed_10m,'speed');
  const pressDisp=applyUnits(pressure,'press');
  const visDisp=applyUnits(Number(vis),'dist');
  const rainDisp=applyUnits(c.precipitation,'rain');

  const nI=Math.max(0,h.time.findIndex(t=>new Date(t)>=now));
  const sH=h.time.slice(nI,nI+12),sT=h.temperature_2m.slice(nI,nI+12),sW=h.weather_code.slice(nI,nI+12),sR=(h.precipitation_probability||[]).slice(nI,nI+12),sPR=(h.precipitation||[]).slice(nI,nI+12);

  // ── ALLERGY INDEX (weather-based, always works) ──────────────────
  const alg=allergyIndex(c.temperature_2m,c.relative_humidity_2m,c.wind_speed_10m,c.weather_code,dew);

  // Smart scores
  const cloudPct=[0,1].includes(c.weather_code)?5:[2].includes(c.weather_code)?35:70;
  const sgScore=Math.max(0,10-Math.round(cloudPct/10)-Math.round(moon.pct/20));
  const heatHI=c.temperature_2m+(0.33*c.relative_humidity_2m*.06105*Math.exp(17.27*c.temperature_2m/(237.7+c.temperature_2m)))-4;
  const heatRisk=Math.min(10,Math.max(0,Math.round((heatHI-25)*.3+uv*.2)));
  const heatLbl=heatRisk<=2?'Low':heatRisk<=5?'Moderate':heatRisk<=7?'High':'Extreme';
  const heatC=heatRisk<=2?'#5ec97a':heatRisk<=5?'#f0c040':heatRisk<=7?'#f08040':'#e85555';
  const nightT=d.temperature_2m_min?.[todayIdx]??c.temperature_2m;
  const sleepRaw=10-Math.abs(nightT-17)*.4-Math.abs(c.relative_humidity_2m-50)*.05;
  const sleepScore=Math.min(10,Math.max(0,Math.round(sleepRaw)));
  const sleepLbl=sleepScore>=8?'Excellent':sleepScore>=6?'Good':sleepScore>=4?'Fair':'Poor';
  const artS=Math.min(10,Math.max(0,Math.round((1015-pressure)*.05+(20-c.temperature_2m)*.15)));
  const artLbl=artS<=2?'Low':artS<=5?'Moderate':artS<=7?'High':'Severe';
  const rainP=sR[0]??0;
  const actS=Math.min(10,Math.max(0,Math.round(10-(c.temperature_2m>32?3:0)-(c.wind_speed_10m>40?3:0)-(rainP>50?4:0)-(uv>8?2:0))));
  const actLbl=actS>=8?'Ideal':actS>=6?'Good':actS>=4?'Fair':'Poor';
  const migraineP=pressure<1000||(pressure<1010&&c.weather_code>=61);
  const frostWarn=nightT<3&&dew<4;
  const umbrellaP=(sR.length>0?Math.max(...sR.slice(0,6).map(Number)):-1)>50;
  const laundry=c.wind_speed_10m>8&&c.relative_humidity_2m<70&&[0,1,2].includes(c.weather_code);
  // Best Day: score every day on comfort (mild temp, low rain, low UV, clear
  // weather code) instead of just "warmest day that happens to beat index 0" —
  // the old reduce() never actually evaluated day 0 against the criteria, so
  // today could win by default even if it was raining.
  let bestI=0,bestScore=-Infinity;
  for(let i=0;i<d.temperature_2m_max.length;i++){
    const tmax=d.temperature_2m_max[i];
    const precip=Number(d.precipitation_probability_max?.[i]??0);
    const uvMax=Number(d.uv_index_max?.[i]??0);
    const badWx=[45,48,51,53,55,61,63,65,71,73,75,77,80,81,82,95,96,99].includes(d.weather_code[i]);
    const tempScore=10-Math.abs(tmax-24)*0.4; // comfort peaks ~24°C, falls off either side
    const score=tempScore-(precip*0.12)-(badWx?3:0)-(uvMax>8?1:0);
    if(score>bestScore){bestScore=score;bestI=i;}
  }
  const anom=Math.round(c.temperature_2m-(lat>0?lat*.2-5:-(lat*.2)-5));
  const anomTxt=anom>2?`+${anom}° above avg`:anom<-2?`${anom}° below avg`:'Near avg';


  // ── NEW FEATURES ────────────────────────────────────────────────
  // Feature 3 & 16: Sparklines (24h feels-like + temperature)
  const fullFL=h.apparent_temperature?h.apparent_temperature.slice(nI,nI+24):h.temperature_2m.slice(nI,nI+24);
  const fullT24=h.temperature_2m.slice(nI,nI+24);
  const sparkFL=sparklineSVG(fullFL,'#4db8f0');
  const sparkT=sparklineSVG(fullT24,'#f08040');

  // Feature 8: Breathing Quality
  const bq=breathingQuality(aqi,c.relative_humidity_2m,c.temperature_2m,c.weather_code);

  // Feature 10: Cold & Flu Risk
  const flu=coldFluRisk(c.temperature_2m,c.relative_humidity_2m,c.wind_speed_10m,c.weather_code);
  // Feature 6: Hydration Score
  const hydro=hydrationScore(c.temperature_2m,c.relative_humidity_2m,uv,c.wind_speed_10m,c.weather_code);

  // Feature 15: Lightning Risk
  const ltng=lightningRisk(c.temperature_2m,dew,pressure,c.weather_code);

  // Feature 5: Storm Proximity (estimate pressure trend from daily)
  const pressTrend=(d.surface_pressure_max&&d.surface_pressure_min)?(d.surface_pressure_min[0]-d.surface_pressure_max[0])/12:-0.5;
  const tmrwCode=d.weather_code?.[1]??0;
  const storm=stormProximity(c.weather_code,pressure,pressTrend,c.wind_speed_10m,[80,82,95,96,99].includes(tmrwCode));

  // Feature 17: Rain Trend
  const rtnd=rainTrend(h.precipitation||[]);

  // ── NEW BATCH: features 9,11,12,13,14,15,17,18,19,20 ────────────────
  const daylightHrs=(rise&&set)?(new Date(set)-new Date(rise))/3600000:12;
  const gbh=goldenBlueHours(rise,set);                                          // 9  Golden/Blue Hour
  const cwd=carWashDay(d);                                                      // 11 Car Wash Day Finder
  const outfit=outfitPicker(c.temperature_2m,c.wind_speed_10m,rainP,uv,c.weather_code); // 12 Outfit Picker
  const dogWalk=dogWalkAdvisor(c.temperature_2m,uv,sH,sT);                      // 13 Dog Walk Advisor
  const kite=kiteWindIndex(c.wind_speed_10m,c.wind_gusts_10m);                  // 14 Kite & Wind Sports
  const solar=solarOutputEstimate(uv,cloudPct,daylightHrs);                     // 15 Solar Output Estimate
  const bug=mosquitoActivity(c.temperature_2m,c.relative_humidity_2m,c.is_day); // 17 Mosquito & Bug Activity
  const staticRisk=staticShockRisk(c.temperature_2m,c.relative_humidity_2m);    // 18 Static Shock/Dry Skin
  const dryEye=dryEyeRisk(c.relative_humidity_2m,c.wind_speed_10m);             // 19 Dry Eye / Contact Lens
  const wcr=weeklyComfortRanking(d);                                            // 4  Weekly Comfort Ranking
  const dispAqiLbl=sensitiveMode?sensAqiLbl(aqi):aqiLbl(aqi);                   // 20 Sensitive Group Mode
  const dispUvLbl=sensitiveMode?sensUvLbl(uv):uvLbl(uv);                        // 20 Sensitive Group Mode
  const flood=flashFloodRisk(h.precipitation||[],Number(d.precipitation_sum?.[0]??0),c.weather_code); // NEW 4: Flash Flood Risk
  const smoke=smokeRisk(pm25,pm10,Number(vis));                                 // NEW 5: Wildfire Smoke Risk
  const alertsFeed=buildAlertsFeed({storm,flashFlood:flood,smoke,heatRisk,aqi:aqiOk?aqi:0,uv,wind:c.wind_speed_10m}); // NEW 1: computed risk alerts

  // Hourly
  function rainBar(p,mm){const w=Math.min(100,Math.max(0,Number(p)||0)),c=w<20?'#6b75a8':w<50?'#4db8f0':w<75?'#1a8fd1':'#0d5fa8';return`<div style="height:3px;border-radius:2px;background:var(--s3);margin-top:4px;overflow:hidden"><div style="width:${w}%;height:100%;background:${c};border-radius:2px"></div></div>`;}
  const hourlyH=sH.map((t,i)=>{const prob=Number(sR[i]??0),mm=Number(sPR[i]??0).toFixed(1)*1,mc=mm>0?'#4db8f0':'var(--mu)';return`<div class="hc"><div class="ht">${hlabel(t)}</div><div class="hi">${WI[sW[i]]||'🌡️'}</div><div class="hte">${tS(sT[i])}</div><div class="hr" style="color:${prob>50?'#4db8f0':'var(--mu)'}">💧${Math.round(prob)}%</div><div style="font-size:.68rem;color:${mc};font-weight:700">${mm>0?mm+'mm':'–'}</div>${rainBar(prob,mm)}</div>`;}).join('');

  // 7-day
  const fcH=d.time.map((t,i)=>{const prob=Number(d.precipitation_probability_max?.[i]??0),mm=Number(d.precipitation_sum?.[i]??0).toFixed(1)*1,rc=prob<20?'#6b75a8':prob<50?'#4db8f0':prob<75?'#1a8fd1':'#0d5fa8',mc=mm>0?'#4db8f0':'var(--mu)';return`<div class="fi"${i===bestI?' style="border:1px solid var(--gn)"':''}><div class="fd">${dlabel(t,i)}${i===bestI?' ⭐':''}</div><div class="fic">${WI[d.weather_code[i]]||'🌡️'}</div><div style="flex:1;padding:0 6px"><div style="font-size:.74rem;color:${rc};font-weight:700">💧${Math.round(prob)}%</div><div style="font-size:.7rem;color:${mc}">${mm>0?mm+' mm':'No rain'}</div><div style="height:3px;border-radius:2px;background:var(--s3);margin-top:3px;overflow:hidden"><div style="width:${prob}%;height:100%;background:${rc};border-radius:2px"></div></div></div><div class="frng"><span class="fhi">${tS(d.temperature_2m_max[i])}</span><span class="flo">${tS(d.temperature_2m_min[i])}</span></div></div>`;}).join('');

  // Tip
  const tipT=alg.score>=7?{t:`🌿 ${alg.label} Allergy Risk`,m:alg.tip}:aqiOk&&aqi>150?{t:'😷 Poor Air Quality',m:'Limit outdoor exposure. Consider a mask outside.'}:uv>=8?{t:'🕶️ High UV Alert',m:'SPF 50+, hat & sunglasses. Seek shade midday.'}:migraineP?{t:'🧠 Migraine Alert',m:'Pressure drop detected. Hydrate and rest if prone to migraines.'}:frostWarn?{t:'❄️ Frost Warning',m:'Windshield may freeze overnight. Cover your car.'}:umbrellaP?{t:'☂️ Bring an Umbrella',m:'Rain likely in the next 6 hours.'}:{t:'✅ Good Conditions',m:'Enjoy the day! Air quality and conditions look favourable.'};

  setOut(`
    <div class="card hero" style="animation-delay:0s">
      <div class="cname">${locMeta?.source==='gps'?`<span class="gpspin" title="Detected via GPS">📍</span>`:''}${name}<button class="star${isFav?' on':''}" id="starbtn" onclick="togFav('${esc(name)}')">${isFav?'⭐':'☆'}</button><button class="star" onclick="shareWeatherCard()" title="Share weather card">📤</button></div>
      <div class="dline">${dateStr} · ${c.is_day?'☀️ Day':'🌙 Night'}</div>
      ${locBadge}
      <div class="ltime">🕐 Local Time: ${localTime}</div>
      <div class="tbig" style="margin-top:8px">${useF?C2F(c.temperature_2m):Math.round(c.temperature_2m)}<sup>${useF?'°F':'°C'}</sup></div>
      <div class="cond">${WI[c.weather_code]||'🌡️'} ${WD[c.weather_code]||''} · Feels ${tF(c.apparent_temperature)}</div>
      <div style="display:flex;justify-content:center"><div class="flbadge" style="color:${fb.c};border-color:${fb.c}44">${fb.ico} ${fb.l}</div></div>
      <div class="emojisummary" style="margin-top:10px">${emSum}</div>
      <div class="srow3" style="margin-top:12px">
        <div class="st"><div class="sv">${c.relative_humidity_2m}%</div><div class="sk">Humidity</div></div>
        <div class="st"><div class="sv">${windSpd}</div><div class="sk">Wind</div></div>
        <div class="st"><div class="sv">${rainDisp}</div><div class="sk">Rain</div></div>
      </div>
    </div>

    ${alertsFeed.some(a=>a.lvl!=='ok')?`<div class="card" style="animation-delay:.03s">
      <div class="slbl">⚠️ Velora Risk Alerts</div>
      <div style="font-size:.68rem;color:var(--mu);margin-bottom:10px">Velora's own analysis of current conditions — not an official government warning.</div>
      ${alertsFeed.filter(a=>a.lvl!=='ok').map(a=>`<div class="alert-card${a.lvl==='warn'?' severity-moderate':''}" style="margin-bottom:8px"><div class="alh"><span>${a.ico} ${a.t}</span></div><div class="alb">${a.m}</div></div>`).join('')}
    </div>`:''}

    <div class="card" style="animation-delay:.05s">
      <div class="slbl">Sun, UV & Moon</div>
      <div class="sunrow">
        <div class="sc"><div class="sico">🌅</div><div class="sv2">${fmtTime(rise)}</div><div class="sk2">Sunrise</div></div>
        <div class="sc"><div class="sico">🌇</div><div class="sv2">${fmtTime(set)}</div><div class="sk2">Sunset</div></div>
        <div class="sc"><div class="sico">🔆</div><div class="sv2">${uv.toFixed(1)} <span style="font-size:.72rem;opacity:.8">${dispUvLbl}</span></div><div class="sk2">UV Index</div><div class="uvt"><div class="uvf" style="width:${100-Math.min(100,uv/11*100)}%"></div></div></div>
        <div class="sc"><div class="sico">${moon.n.split(' ')[0]}</div><div class="sv2">${moon.pct}%</div><div class="sk2">${moon.n.split(' ').slice(1).join(' ')}</div></div>
      </div>
    </div>

    ${tw?`<div class="card" style="animation-delay:.08s">
      <div class="slbl">🌅 Twilight Stages</div>
      <div class="twrow">
        <div class="twc"><div class="twico">🌌</div><div class="twv">${tw.astroDawn}</div><div class="twk">Astro Dawn</div></div>
        <div class="twc"><div class="twico">🌃</div><div class="twv">${tw.nautDawn}</div><div class="twk">Nautical Dawn</div></div>
        <div class="twc"><div class="twico">🌆</div><div class="twv">${tw.civilDawn}</div><div class="twk">Civil Dawn</div></div>
        <div class="twc"><div class="twico">☀️</div><div class="twv">${tw.sunrise}</div><div class="twk">Sunrise</div></div>
      </div>
      <div class="twrow" style="margin-top:7px">
        <div class="twc"><div class="twico">🌇</div><div class="twv">${tw.sunset}</div><div class="twk">Sunset</div></div>
        <div class="twc"><div class="twico">🌆</div><div class="twv">${tw.civilDusk}</div><div class="twk">Civil Dusk</div></div>
        <div class="twc"><div class="twico">🌃</div><div class="twv">${tw.nautDusk}</div><div class="twk">Nautical Dusk</div></div>
        <div class="twc"><div class="twico">🌌</div><div class="twv">${tw.astroDusk}</div><div class="twk">Astro Dusk</div></div>
      </div>
    </div>`:''}

    ${gbh?`<div class="card" style="animation-delay:.085s">
      <div class="slbl">📸 Golden Hour & Blue Hour</div>
      <div class="twrow">
        <div class="twc"><div class="twico">🔵</div><div class="twv">${gbh.blueMorn}</div><div class="twk">Blue Hour AM</div></div>
        <div class="twc"><div class="twico">🌟</div><div class="twv">${gbh.goldenMorn}</div><div class="twk">Golden Hour AM</div></div>
        <div class="twc"><div class="twico">🌟</div><div class="twv">${gbh.goldenEve}</div><div class="twk">Golden Hour PM</div></div>
        <div class="twc"><div class="twico">🔵</div><div class="twv">${gbh.blueEve}</div><div class="twk">Blue Hour PM</div></div>
      </div>
    </div>`:''}

    <div class="card" style="animation-delay:.09s">
      <div class="slbl">Atmospheric Details</div>
      <div class="mgrid">
        <div class="met"><div class="mv">${visDisp}</div><div class="mk">Visibility</div></div>
        <div class="met"><div class="mv">${tF(dew)}</div><div class="mk">Dew Point</div></div>
        <div class="met"><div class="mv">${pressDisp}</div><div class="mk">Pressure</div></div>
        <div class="met"><div class="mv">${wdg} ${c.wind_direction_10m??0}°</div><div class="mk">Wind Dir.</div></div>
        <div class="met"><div class="mv">${anomTxt}</div><div class="mk">Temp Anomaly</div></div>
      </div>
    </div>


    <div class="card" style="animation-delay:.11s">
      <div class="slbl">📈 24h Temperature Trend</div>
      <div class="spark-wrap" style="margin:0 -4px">
        <div style="display:flex;justify-content:space-between;font-size:.74rem;color:var(--mu);margin-bottom:6px"><span>Temperature</span><span style="color:#f08040;font-weight:700">Now → +24h</span></div>
        ${sparkT}
        <div style="margin-top:10px;border-top:1px solid var(--bd);padding-top:8px">
          <div style="display:flex;justify-content:space-between;font-size:.74rem;color:var(--mu);margin-bottom:6px"><span>Feels Like</span><span style="color:#4db8f0;font-weight:700">Now → +24h</span></div>
          ${sparkFL}
        </div>
      </div>
      <div class="rtrend" style="margin-top:10px;border-top:1px solid var(--bd);padding-top:8px">
        <span style="font-size:1.1rem">${rtnd.icon}</span>
        <span style="color:${rtnd.c}">${rtnd.t}</span>
        ${rtnd.t!=='No Rain Expected'&&rtnd.t!=='Unknown'?`<span style="font-size:.6rem;color:var(--mu);margin-left:auto">next 8h</span>`:''}
      </div>
    </div>

    <div class="alg-card" style="animation-delay:.12s">
      <div class="slbl">🌿 Allergy Index</div>
      <div class="alg-top">
        <div>
          <div class="alg-num" style="color:${alg.color}">${alg.label}</div>
          <div class="alg-lbl" style="color:${alg.color}">${alg.sub}</div>
        </div>
        <div style="text-align:right">
          <div style="font-size:2.4rem;font-weight:800;color:${alg.color}">${alg.score}<span style="font-size:1.2rem;opacity:.5">/10</span></div>
        </div>
      </div>
      <div class="alg-bar"></div>
      <div class="alg-cur-wrap"><div class="alg-cur" style="left:${alg.pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:.72rem;color:var(--mu);margin-top:2px"><span>Very Low</span><span>Moderate</span><span>Extreme</span></div>
      <div class="pgrid">
        <div class="pg"><div class="pv" style="color:${c.relative_humidity_2m<50?'#f08040':'#5ec97a'}">${c.relative_humidity_2m}%</div><div class="pk">Humidity</div></div>
        <div class="pg"><div class="pv" style="color:${c.wind_speed_10m>10&&c.wind_speed_10m<30?'#f08040':'#5ec97a'}">${Math.round(c.wind_speed_10m)} km/h</div><div class="pk">Wind</div></div>
        <div class="pg"><div class="pv" style="color:${c.temperature_2m>10&&c.temperature_2m<30?'#f08040':'#5ec97a'}">${tF(c.temperature_2m)}</div><div class="pk">Temp</div></div>
        <div class="pg"><div class="pv" style="color:${[0,1].includes(c.weather_code)?'#f08040':'#5ec97a'}">${WI[c.weather_code]||'🌡️'} ${[0,1].includes(c.weather_code)?'High':'Lower'}</div><div class="pk">Sun Exposure</div></div>
        <div class="pg"><div class="pv" style="color:${dew<5?'#f08040':'#5ec97a'}">${tF(dew)}</div><div class="pk">Dew Point</div></div>
        <div class="pg"><div class="pv" style="color:${alg.color}">${alg.label}</div><div class="pk">Overall Risk</div></div>
      </div>
      <div class="pest">⚠️ ${alg.tip}</div>
    </div>

    <div class="tip" style="animation-delay:.15s"><strong>${tipT.t}</strong>${tipT.m}</div>

    ${aqiOk?`<div class="card" style="animation-delay:.18s">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div><div class="slbl" style="margin-bottom:4px">Air Quality Index${sensitiveMode?' <span style="color:var(--yn);font-size:.7rem">· Sensitive Mode</span>':''}</div><div style="font-size:2.4rem;font-weight:800;color:${aqiCol(aqi)};line-height:1">${aqi}</div><div style="font-size:.9rem;font-weight:700;color:${aqiCol(aqi)};margin-top:2px">${dispAqiLbl}</div></div>
        <span style="font-size:.76rem;color:var(--mu)">US AQI</span>
      </div>
      <div class="aqi-bar"></div>
      <div class="aqi-cur-wrap"><div class="aqi-cur" style="left:${pct(aqi)}%"></div></div>
      <div class="aqi-leg"><span>Good</span><span>Moderate</span><span>Unhealthy</span><span>Hazardous</span></div>
      <div class="pollgrid">
        <div class="poll"><div class="pollv">${pm25.toFixed(1)}</div><div class="pollk">PM2.5</div></div>
        <div class="poll"><div class="pollv">${pm10.toFixed(1)}</div><div class="pollk">PM10</div></div>
        <div class="poll"><div class="pollv">${co}</div><div class="pollk">CO mg/m³</div></div>
        <div class="poll"><div class="pollv">${no2}</div><div class="pollk">NO₂ μg/m³</div></div>
        <div class="poll"><div class="pollv">${o3}</div><div class="pollk">O₃ μg/m³</div></div>
        <div class="poll"><div class="pollv">${pressure}</div><div class="pollk">hPa</div></div>
      </div>
    </div>`:''}

    <div class="card" style="animation-delay:.21s">
      <div class="slbl">Smart Scores</div>
      <div class="tiles">
        <div class="tile"><div style="font-size:1.1rem">😴</div><div class="tval" style="color:${sleepScore>=7?'#5ec97a':sleepScore>=5?'#f0c040':'#e85555'}">${sleepLbl}</div><div class="tlbl">Sleep Quality</div>${bar(sleepScore*10,sleepScore>=7?'#5ec97a':sleepScore>=5?'#f0c040':'#e85555')}</div>
        <div class="tile"><div style="font-size:1.1rem">🌡️</div><div class="tval" style="color:${heatC}">${heatLbl}</div><div class="tlbl">Heat Stroke Risk</div>${bar(heatRisk*10,heatC)}</div>
        <div class="tile"><div style="font-size:1.1rem">🦴</div><div class="tval" style="color:${artS<=2?'#5ec97a':artS<=5?'#f0c040':'#e85555'}">${artLbl}</div><div class="tlbl">Arthritis Index</div>${bar(artS*10,artS<=2?'#5ec97a':artS<=5?'#f0c040':'#e85555')}</div>
        <div class="tile"><div style="font-size:1.1rem">🏃</div><div class="tval" style="color:${actS>=8?'#5ec97a':actS>=5?'#f0c040':'#e85555'}">${actLbl}</div><div class="tlbl">Activity Score</div>${bar(actS*10,actS>=8?'#5ec97a':actS>=5?'#f0c040':'#e85555')}</div>
        <div class="tile"><div style="font-size:1.1rem">🔭</div><div class="tval" style="color:${sgScore>=7?'#5ec97a':sgScore>=4?'#f0c040':'#e85555'}">${sgScore}/10</div><div class="tlbl">Stargazing</div>${bar(sgScore*10,sgScore>=7?'#5ec97a':sgScore>=4?'#f0c040':'#e85555')}</div>
        <div class="tile"><div style="font-size:1.1rem">👕</div><div class="tval" style="color:${laundry?'#5ec97a':'#e85555'}">${laundry?'Good':'Poor'}</div><div class="tlbl">Laundry Drying</div>${bar(laundry?80:20,laundry?'#5ec97a':'#e85555')}</div>
        <div class="tile"><div style="font-size:1.1rem">❄️</div><div class="tval" style="color:${frostWarn?'#4db8f0':'#5ec97a'}">${frostWarn?'Warning':'Clear'}</div><div class="tlbl">Frost / Windshield</div>${bar(frostWarn?90:10,frostWarn?'#4db8f0':'#5ec97a')}</div>
        <div class="tile"><div style="font-size:1.1rem">🧠</div><div class="tval" style="color:${migraineP?'#e85555':'#5ec97a'}">${migraineP?'Risk':'Low Risk'}</div><div class="tlbl">Migraine Trigger</div>${bar(migraineP?80:15,migraineP?'#e85555':'#5ec97a')}</div>
        <div class="tile"><div style="font-size:1.1rem">☂️</div><div class="tval" style="color:${umbrellaP?'#4db8f0':'#5ec97a'}">${umbrellaP?'Yes':'No'}</div><div class="tlbl">Umbrella Needed</div>${bar(umbrellaP?90:10,umbrellaP?'#4db8f0':'#5ec97a')}</div>

        <div class="tile"><div style="font-size:1.1rem">🫁</div><div class="tval" style="color:${bq.c}">${bq.l}</div><div class="tlbl">Breathing Quality</div>${bar(bq.s*10,bq.c)}</div>
        <div class="tile"><div style="font-size:1.1rem">🤧</div><div class="tval" style="color:${flu.c}">${flu.l}</div><div class="tlbl">Cold & Flu Risk</div>${bar(flu.s*10,flu.c)}</div>
        <div class="tile"><div style="font-size:1.1rem">💧</div><div class="tval" style="color:${hydro.c}">${hydro.total} glasses</div><div class="tlbl">Hydration Today${hydro.extra>0?' +'+hydro.extra:''}</div>${bar(Math.min(100,(hydro.total/16)*100),hydro.c)}</div>
        <div class="tile"><div style="font-size:1.1rem">⚡</div><div class="tval" style="color:${ltng.c}">${ltng.l}</div><div class="tlbl">Lightning Risk</div>${bar(ltng.s*10,ltng.c)}</div>
        ${storm.show?`<div class="tile"><div style="font-size:1.1rem">🌩️</div><div class="tval" style="color:${storm.c}">${storm.l}</div><div class="tlbl">${storm.sub}</div>${bar(storm.l.includes('Active')?100:storm.l.includes('Approaching')?70:40,storm.c)}</div>`:''}

        <div class="tile"><div style="font-size:1.1rem">🌌</div><div class="tval" style="color:${lat>50||lat<-50?'#f0c040':'var(--mu)'}">${lat>55||lat<-55?'Possible':lat>45||lat<-45?'Low':'Unlikely'}</div><div class="tlbl">Aurora Probability</div>${bar(lat>55||lat<-55?60:lat>45||lat<-45?25:5,'#4db8f0')}</div>

        <div class="tile" title="${dogWalk.paw.tip}"><div style="font-size:1.1rem">🐾</div><div class="tval" style="color:${dogWalk.paw.c}">${dogWalk.paw.l}</div><div class="tlbl">Dog Walk (Pavement)</div>${bar(dogWalk.paw.l==='Safe'?15:dogWalk.paw.l==='Caution'?60:95,dogWalk.paw.c)}</div>
        <div class="tile" title="${kite.tip}"><div style="font-size:1.1rem">🪁</div><div class="tval" style="color:${kite.c}">${kite.l}</div><div class="tlbl">Kite & Wind Sports</div>${bar(kite.l==='Great'?90:kite.l==='Strong'?65:kite.l==='Too Calm'?15:35,kite.c)}</div>
        <div class="tile"><div style="font-size:1.1rem">🔋</div><div class="tval" style="color:${solar.c}">${solar.l}</div><div class="tlbl">Solar Output · ${solar.kwh} kWh/m²</div>${bar(solar.pct,solar.c)}</div>
        <div class="tile" title="${bug.tip}"><div style="font-size:1.1rem">🦟</div><div class="tval" style="color:${bug.c}">${bug.l}</div><div class="tlbl">Mosquito Activity</div>${bar(bug.s*10,bug.c)}</div>
        <div class="tile" title="${staticRisk.tip}"><div style="font-size:1.1rem">⚡</div><div class="tval" style="color:${staticRisk.l==='Low'?'#5ec97a':staticRisk.l==='Moderate'?'#f0c040':'#e85555'}">${staticRisk.l}</div><div class="tlbl">Static / Dry Skin</div>${bar(staticRisk.l==='Low'?15:staticRisk.l==='Moderate'?55:90,staticRisk.l==='Low'?'#5ec97a':staticRisk.l==='Moderate'?'#f0c040':'#e85555')}</div>
        <div class="tile" title="${dryEye.tip}"><div style="font-size:1.1rem">👁️</div><div class="tval" style="color:${dryEye.l==='Low'?'#5ec97a':dryEye.l==='Moderate'?'#f0c040':'#e85555'}">${dryEye.l}</div><div class="tlbl">Dry Eye / Contacts</div>${bar(dryEye.l==='Low'?15:dryEye.l==='Moderate'?55:90,dryEye.l==='Low'?'#5ec97a':dryEye.l==='Moderate'?'#f0c040':'#e85555')}</div>
        <div class="tile" title="${flood.tip}"><div style="font-size:1.1rem">🌊</div><div class="tval" style="color:${flood.c}">${flood.l}</div><div class="tlbl">Flash Flood Risk</div>${bar(flood.s*10,flood.c)}</div>
        ${aqiOk?`<div class="tile" title="${smoke.tip}"><div style="font-size:1.1rem">🔥</div><div class="tval" style="color:${smoke.c}">${smoke.l}</div><div class="tlbl">Wildfire Smoke Risk</div>${bar(smoke.s*10,smoke.c)}</div>`:''}
      </div>
    </div>

    <div class="card" style="animation-delay:.24s">
      <div class="slbl">👕 Today's Outfit</div>
      <div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center">
        ${outfit.map(it=>`<div style="background:var(--s2);border-radius:12px;padding:10px 14px;text-align:center;min-width:64px"><div style="font-size:1.5rem">${it.ico}</div><div style="font-size:.7rem;color:var(--mu);margin-top:4px">${it.l}</div></div>`).join('')}
      </div>
    </div>

    <div class="card" style="animation-delay:.245s">
      <div class="slbl">🌍 Weather Twin</div>
      <div id="twinBody" style="font-size:.85rem;color:var(--mu)">Finding a city with matching weather right now…</div>
    </div>

    <div class="card" style="animation-delay:.25s">
      <div class="slbl">🗺️ Weather Maps</div>
      <div class="maplayers">
        <button class="btn on" id="mlyr-radar" onclick="setMapLayer('radar')">🌧️ Radar</button>
        <button class="btn" id="mlyr-satellite" onclick="setMapLayer('satellite')">🛰️ Satellite</button>
        <button class="btn" id="mlyr-wind" onclick="setMapLayer('wind')">💨 Wind</button>
        <button class="btn" id="mlyr-heat" onclick="setMapLayer('heat')">🌡️ Heat</button>
        <button class="btn" id="mlyr-storm" onclick="setMapLayer('storm')">🌀 Storm Track</button>
      </div>
      <div id="weatherMap"></div>
      <div id="mapNote" style="font-size:.68rem;color:var(--mu);margin-top:8px"></div>
    </div>


    <div class="card" style="animation-delay:.27s">
      <div class="slbl">Hourly · Next 12h</div>
      <div class="hscroll">${hourlyH}</div>
    </div>

    <div class="card" style="animation-delay:.29s">
      <div class="slbl">📊 Weekly Comfort Ranking</div>
      <div class="flist">${wcr.map((it,rank)=>`<div class="fi"><div class="fd">#${rank+1} ${dlabel(it.t,it.i)}</div><div class="fic">${WI[d.weather_code[it.i]]||'🌡️'}</div><div style="flex:1;padding:0 6px;font-size:.74rem;color:var(--mu)">Comfort score ${it.score.toFixed(1)}</div><div class="frng"><span class="fhi">${tS(d.temperature_2m_max[it.i])}</span><span class="flo">${tS(d.temperature_2m_min[it.i])}</span></div></div>`).join('')}</div>
    </div>

    <div class="tip" style="animation-delay:.31s"><strong>🚗 Best Car Wash Day</strong>${cwd.good?`${dlabel(d.time[cwd.index],cwd.index)} looks best — only ${cwd.precipProb}% chance of rain.`:`No great rain-free day this week — lowest chance is ${cwd.precipProb}% on ${dlabel(d.time[cwd.index],cwd.index)}.`}</div>

    <div class="card" style="animation-delay:.32s">
      <div class="slbl">🔔 Notifications & Alert Rules</div>
      <button class="btn" onclick="enableCustomAlerts()" style="margin-bottom:6px">🔔 Enable Notifications</button>
      <div id="rulesStatus" style="font-size:.72rem;color:var(--mu);margin-bottom:10px"></div>
      <div style="font-size:.78rem;color:var(--mu);margin-bottom:8px">☀️ Daily Briefing time: <input type="time" value="${getBriefingTime()}" onchange="setBriefingTime(this.value)" style="background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:5px 8px;font-size:.78rem"></div>
      <div id="rulesList"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">
        <select id="ruleMetric" style="background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:.78rem">
          <option value="rain">Rain chance %</option>
          <option value="temp">Temperature °C</option>
          <option value="aqi">AQI</option>
          <option value="wind">Wind km/h</option>
          <option value="uv">UV Index</option>
        </select>
        <select id="ruleOp" style="background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:.78rem">
          <option value=">">above</option>
          <option value="<">below</option>
        </select>
        <input id="ruleValue" type="number" placeholder="Value" style="width:70px;background:var(--s2);color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:6px;font-size:.78rem">
        <button class="btn" onclick="addRuleFromForm()">+ Add</button>
      </div>
      <div style="font-size:.68rem;color:var(--mu);margin-top:8px">Checked while this app is open and refreshing — not true background push notifications.</div>
    </div>

    <div class="card" style="animation-delay:.33s">
      <div class="slbl">📲 Widget Preview</div>
      <div style="font-size:.7rem;color:var(--mu);margin-bottom:10px">A preview of a compact home-screen widget — actual OS widgets need a native app wrapper, which the web platform can't install directly.</div>
      ${renderWidgetPreview(name,useF?C2F(c.temperature_2m):Math.round(c.temperature_2m),useF?'°F':'°C',WI[c.weather_code]||'🌡️',WD[c.weather_code]||'')}
      <div style="display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap">
        <button class="btn" onclick="generateWallpaper()">🖼️ Download Wallpaper</button>
        <button class="btn" onclick="generateComplicationMockup()">⌚ Download Complication</button>
      </div>
    </div>

    <div class="card" style="animation-delay:.34s">
      <div class="slbl">🏙️ Multi-City Dashboard</div>
      <div id="multiCityBody" style="font-size:.78rem;color:var(--mu)">Loading your cities…</div>
    </div>

    <div class="card" style="animation-delay:.3s">
      <div class="slbl">7-Day Forecast · ⭐ Best Day</div>
      <div class="flist">${fcH}</div>
    </div>
  `);
  updateWeatherTwin(lat,lon,c.temperature_2m,c.relative_humidity_2m,c.weather_code);
  loadSevereAlerts(lat,lon);
  renderAlertRulesUI();
  checkCustomAlerts(c,d,aqi,todayIdx);
  checkDailyBriefing(name,c,d,todayIdx);
  loadMultiCityDashboard();
  initWeatherMap(lat,lon);
}
function setOut(h){document.getElementById('out').innerHTML=h;}

// ── SERVICE WORKER ───────────────────────────────────────────────────
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    fetch('./sw.js',{method:'HEAD'}).then(r=>{
      if(!r.ok)return;
      navigator.serviceWorker.register('./sw.js').then(reg=>{
        // Notify user when new version is available
        reg.addEventListener('updatefound',()=>{
          const nw=reg.installing;
          nw.addEventListener('statechange',()=>{
            if(nw.state==='installed'&&navigator.serviceWorker.controller){
              const b=document.createElement('button');
              b.textContent='🔄 Update available — tap to reload';
              b.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ac);color:#000;border:none;padding:10px 18px;border-radius:20px;font-size:.72rem;font-weight:700;cursor:pointer;z-index:999;box-shadow:0 4px 16px rgba(0,0,0,.4)';
              b.onclick=()=>window.location.reload();
              document.body.appendChild(b);
            }
          });
        });
      }).catch(()=>{});
    }).catch(()=>{});
  });
  // Install prompt (Add to Home Screen)
  let dp=null;
  window.addEventListener('beforeinstallprompt',e=>{
    e.preventDefault();dp=e;
    const b=document.createElement('button');
    b.className='btn';b.textContent='📲 Install';
    b.style.cssText='background:#5ec97a;color:#000;border-color:#5ec97a';
    b.onclick=()=>{dp.prompt();dp.userChoice.then(()=>{dp=null;b.remove();});};
    document.querySelector('.hrow').prepend(b);
  });
}

initShake();
initBattery();
// Sync imperial button state
if(useImperial)document.getElementById('impbtn')?.classList.add('uon');
if(sensitiveMode)document.getElementById('sensbtn')?.classList.add('on');
checkLocationOnLoad();
doFetch();
</script>
</body>
</html>
