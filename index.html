<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0d0f14;--s1:#141720;--s2:#1c2030;--s3:#242840;--tx:#e4e8ff;--mu:#6b75a8;--ac:#4db8f0;--gn:#5ec97a;--yn:#f0c040;--or:#f08040;--rd:#e85555;--bd:rgba(255,255,255,.07);--sh:0 4px 24px rgba(0,0,0,.5);--r:14px;--f:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
[data-theme=light]{--bg:#eef1fa;--s1:#fff;--s2:#e8ecf8;--s3:#dde3f5;--tx:#111827;--mu:#4a5490;--ac:#0277bd;--bd:rgba(0,0,0,.07);--sh:0 4px 20px rgba(0,0,0,.1)}
[data-theme=oled]{--bg:#000;--s1:#0a0a0a;--s2:#111;--s3:#181818;--tx:#fff;--mu:#6b75a8;--bd:rgba(255,255,255,.05);--sh:0 4px 24px rgba(0,0,0,.9)}
[data-theme=hc]{--bg:#000;--s1:#000;--s2:#111;--s3:#222;--tx:#fff;--mu:#ffff00;--ac:#00ffff;--gn:#00ff00;--yn:#ffaa00;--or:#ff6600;--rd:#ff0000;--bd:#fff;--sh:none}
body{background:var(--bg);color:var(--tx);font-family:var(--f);min-height:100vh;display:flex;flex-direction:column;align-items:center;transition:background .3s,color .3s}

/* OFFLINE */
#ob{display:none;width:100%;background:var(--rd);color:#fff;text-align:center;font-size:.85rem;padding:6px;letter-spacing:1px;position:sticky;top:0;z-index:99}

/* HEADER */
header{width:100%;max-width:520px;padding:14px 12px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font-size:1.15rem;font-weight:800;color:var(--ac);letter-spacing:-.5px}
.hrow{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;align-items:center}
.btn{background:var(--s1);border:1px solid var(--bd);color:var(--tx);font-size:.72rem;font-family:var(--f);padding:4px 8px;border-radius:20px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn:hover,.btn.on{background:var(--ac);color:#000;border-color:var(--ac)}
.btn.uf{background:var(--yn);color:#000;border-color:var(--yn)}
.themewheel{background:var(--s1);border:1px solid var(--bd);border-radius:50%;padding:4px;cursor:pointer;line-height:0;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.themewheel svg{display:block}
.themewheel path{stroke:transparent;stroke-width:3;paint-order:stroke;transition:stroke .2s,opacity .2s;opacity:.6;cursor:pointer}
.themewheel path:hover{opacity:1}
.themewheel path.active{stroke:var(--ac);opacity:1}

/* MAIN */
main{width:100%;max-width:520px;padding:12px 10px;flex:1;display:flex;flex-direction:column;gap:10px}

/* SEARCH */
.swrap{position:relative}
.srow{display:flex;gap:7px}
.srow input{flex:1;background:var(--s1);border:1px solid var(--bd);color:var(--tx);font-family:var(--f);font-size:1rem;padding:11px 14px;border-radius:var(--r);outline:none;transition:border .2s}
.srow input::placeholder{color:var(--mu);opacity:.7}
.srow input:focus{border-color:var(--ac)}
.srow button{background:var(--ac);color:#000;font-weight:700;font-size:.75rem;border:none;padding:11px 16px;border-radius:var(--r);cursor:pointer}
#sug{position:absolute;top:calc(100% + 4px);left:0;right:52px;background:var(--s1);border:1px solid var(--bd);border-radius:12px;z-index:99;overflow:hidden;box-shadow:var(--sh);display:none}
.si{padding:11px 14px;font-size:.92rem;cursor:pointer;border-bottom:1px solid var(--bd);transition:background .15s}
.si:last-child{border-bottom:none}
.si:hover{background:var(--s2)}

/* FAVS */
.favrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.favrow::-webkit-scrollbar{display:none}
.fc{background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:6px 12px;font-size:.75rem;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;flex-shrink:0;transition:all .2s}
.fc:hover{border-color:var(--ac);color:var(--ac)}
.fx{opacity:.3;font-size:.58rem}.fx:hover{opacity:1;color:var(--rd)}

/* CARD */
.card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);animation:up .35s ease both}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.slbl{font-size:.78rem;text-transform:uppercase;letter-spacing:2px;color:var(--mu);margin-bottom:10px}

/* HERO */
.hero{text-align:center;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;inset:0;background:var(--hglow,radial-gradient(ellipse at 50% 0%,rgba(77,184,240,.12),transparent 70%));pointer-events:none}
.cname{font-size:1.35rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:8px}
.star{background:none;border:none;color:var(--tx);font-size:.95rem;cursor:pointer;opacity:.3;transition:opacity .2s;padding:0}
.gpspin{font-size:.85rem;opacity:.85}
.locbanner{background:var(--s1);border:1px solid var(--yn);border-left:3px solid var(--yn);border-radius:var(--r);padding:12px 14px;font-size:.84rem;line-height:1.55;color:var(--tx)}
.locbanner button{margin-top:8px;background:var(--yn);color:#000;border:none;padding:8px 16px;border-radius:16px;font-size:.76rem;font-weight:700;cursor:pointer}
.locbanner .lb-dismiss{background:none;color:var(--mu);text-decoration:underline;font-weight:400;padding:0;margin-left:10px}
.alert-card{background:var(--s1);border:1px solid var(--rd);border-left:4px solid var(--rd);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;animation:up .35s ease both}
.alert-card.severity-moderate{border-color:var(--yn);border-left-color:var(--yn)}
.alert-card .alh{font-weight:800;font-size:.88rem;display:flex;justify-content:space-between;align-items:center;gap:8px}
.alert-card .alb{font-size:.8rem;color:var(--mu);margin-top:5px;line-height:1.5}
.alert-card .alx{background:none;border:none;color:var(--mu);cursor:pointer;font-size:.75rem;text-decoration:underline;padding:0}
.maplayers{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
#weatherMap{width:100%;height:280px;border-radius:12px;overflow:hidden;background:var(--s2)}
.wind-arrow{font-size:1.1rem;text-shadow:0 0 3px #000,0 0 3px #000}
.star.on,.star:hover{opacity:1}
.dline{font-size:.82rem;color:var(--mu);margin:3px 0 14px}
.tbig{font-size:4rem;font-weight:800;line-height:1;letter-spacing:-3px;color:var(--ac)}
.tbig sup{font-size:1.7rem;vertical-align:top;margin-top:8px}
.cond{font-size:.82rem;color:var(--mu);text-transform:uppercase;letter-spacing:2px;margin:5px 0 14px}
.srow3{display:flex;border-top:1px solid var(--bd);padding-top:12px}
.st{flex:1;text-align:center;border-right:1px solid var(--bd)}
.st:last-child{border-right:none}
.sv{font-size:1rem;font-weight:700}
.sk{font-size:.72rem;color:var(--mu);text-transform:uppercase;letter-spacing:1px;margin-top:2px}

/* SUN ROW */
.sunrow{display:flex;gap:8px}
.sc{flex:1;background:var(--s2);border-radius:11px;padding:10px 8px;text-align:center}
.sico{font-size:1.3rem}
.sv2{font-size:1rem;font-weight:700;margin:3px 0 2px}
.sk2{font-size:.72rem;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}
.uvt{height:5px;border-radius:3px;background:linear-gradient(to right,#5ec97a,#f0c040,#f08040,#e85555,#7b1fa2);margin-top:6px;overflow:hidden;position:relative}
.uvf{height:100%;background:rgba(0,0,0,.45);position:absolute;right:0;top:0}

/* METRICS */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.met{background:var(--s2);border-radius:11px;padding:10px 8px;text-align:center}
.mv{font-size:1rem;font-weight:700}
.mk{font-size:.72rem;color:var(--mu);text-transform:uppercase;letter-spacing:.8px;margin-top:3px}

/* ALLERGY CARD — dedicated full card */
.alg-card{background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);padding:16px;box-shadow:var(--sh);animation:up .35s ease both}
.alg-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
.alg-num{font-size:2rem;font-weight:800;line-height:1}
.alg-lbl{font-size:.9rem;font-weight:700;margin-top:2px}
.alg-bar{height:8px;border-radius:4px;overflow:hidden;background:linear-gradient(to right,#5ec97a,#aed561,#f0c040,#f08040,#e85555)}
.alg-cur-wrap{position:relative;height:14px}
.alg-cur{position:absolute;top:1px;width:3px;height:10px;border-radius:2px;background:var(--tx);transition:left .6s cubic-bezier(.34,1.56,.64,1)}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.pg{background:var(--s2);border-radius:10px;padding:8px;text-align:center;border:1px solid var(--bd)}
.pv{font-size:.95rem;font-weight:700}
.pk{font-size:.72rem;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.pest{font-size:.76rem;color:var(--mu);margin-top:8px;text-align:center}

/* AQI CARD */
.aqi-bar{height:8px;border-radius:4px;overflow:hidden;background:linear-gradient(to right,#5ec97a,#aed561,#f0c040,#f08040,#e85555,#7b1fa2);margin-top:12px}
.aqi-cur-wrap{position:relative;height:14px}
.aqi-cur{position:absolute;top:1px;width:3px;height:10px;border-radius:2px;background:var(--tx);transition:left .6s cubic-bezier(.34,1.56,.64,1)}
.aqi-leg{display:flex;justify-content:space-between;font-size:.7rem;color:var(--mu)}
.pollgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.poll{background:var(--s2);border-radius:10px;padding:8px;text-align:center}
.pollv{font-size:.95rem;font-weight:700}
.pollk{font-size:.72rem;color:var(--mu);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}

/* TIP */
.tip{background:var(--s1);border:1px solid var(--bd);border-left:3px solid var(--ac);border-radius:var(--r);padding:14px 16px;font-size:.9rem;line-height:1.6;color:var(--mu);animation:up .35s ease both}
.tip strong{color:var(--tx);display:block;margin-bottom:6px;font-size:.82rem;text-transform:uppercase;letter-spacing:1px}

/* TILES (smart scores) */
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.tile{background:var(--s2);border-radius:12px;padding:12px;border:1px solid var(--bd)}
.tval{font-size:1.05rem;font-weight:800;margin:2px 0}
.tlbl{font-size:.75rem;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}
.tbar{height:4px;border-radius:2px;background:var(--s3);margin-top:7px;overflow:hidden}
.tbar div{height:100%;border-radius:2px;transition:width .6s}

/* HOURLY */
.hscroll{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.hscroll::-webkit-scrollbar{display:none}
.hc{background:var(--s2);border:1px solid var(--bd);border-radius:11px;padding:10px 10px;text-align:center;min-width:62px;flex-shrink:0}
.ht{font-size:.7rem;color:var(--mu);margin-bottom:3px}
.hi{font-size:1.35rem;line-height:1.2}
.hte{font-size:.9rem;font-weight:700;margin-top:3px}
.hr{font-size:.7rem;color:var(--ac);margin-top:2px}

/* FORECAST */
.flist{display:flex;flex-direction:column;gap:7px}
.fi{background:var(--s2);border-radius:11px;padding:11px 14px;display:flex;align-items:center;justify-content:space-between}
.fd{font-size:.9rem;font-weight:700;width:76px}
.fic{font-size:1.3rem;flex:1;text-align:center}
.frng{font-size:.9rem;display:flex;gap:8px}
.fhi{font-weight:700}
.flo{color:var(--mu)}



/* FEATURE 17: Emoji Summary Bar */
.emojisummary{background:var(--s2);border-radius:12px;padding:10px 14px;font-size:.88rem;letter-spacing:.5px;text-align:center;border:1px solid var(--bd);word-break:break-all}

/* FEATURE 18: Feels-Like Badge */
.flbadge{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border-radius:20px;padding:5px 14px;font-size:.84rem;font-weight:700;border:1px solid var(--bd);margin-top:6px}

/* FEATURE 16: Local Time */
.ltime{font-size:.78rem;color:var(--mu);font-family:var(--f);margin-top:2px}

/* FEATURE 11: Twilight rows */
.twrow{display:flex;gap:7px;flex-wrap:wrap}
.twc{flex:1;min-width:80px;background:var(--s2);border-radius:11px;padding:9px 8px;text-align:center;border:1px solid var(--bd)}
.twico{font-size:1.2rem}
.twv{font-size:.84rem;font-weight:700;margin:3px 0 2px}
.twk{font-size:.65rem;color:var(--mu);text-transform:uppercase;letter-spacing:.8px}

/* FEATURE 6: Shake indicator */
#shakeHint{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--s1);border:1px solid var(--bd);border-radius:20px;padding:7px 16px;font-size:.72rem;color:var(--mu);opacity:0;transition:opacity .4s;pointer-events:none;z-index:99;white-space:nowrap}

/* FEATURE 24: Unit panel */
.unit-panel{background:var(--s2);border-radius:12px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;border:1px solid var(--bd)}
.unit-grp{display:flex;gap:4px;align-items:center;font-size:.72rem;color:var(--mu)}
.unit-grp span{font-weight:700;color:var(--tx)}
.ubtn{background:var(--s1);border:1px solid var(--bd);color:var(--tx);font-size:.65rem;padding:3px 8px;border-radius:12px;cursor:pointer;transition:all .2s}
.ubtn.uon{background:var(--ac);color:#000;border-color:var(--ac)}

/* FEATURE 23: Battery saver */
@media (prefers-reduced-motion:reduce){.card{animation:none}*{transition:none!important}}

/* SPARKLINE */
.spark-wrap{background:var(--s2);border-radius:12px;padding:12px 14px;border:1px solid var(--bd);margin-top:0}
.spark-lbl{font-size:.78rem;text-transform:uppercase;letter-spacing:2px;color:var(--mu);margin-bottom:8px}
.spark-svg{width:100%;height:48px;overflow:visible}
.spark-svg polyline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.spark-svg text{font-size:10px;font-family:var(--f);fill:var(--mu)}
/* RAIN TREND */
.rtrend{display:flex;align-items:center;gap:6px;font-size:.9rem;font-weight:700;margin-top:4px}
/* NEW TILES extra */
.tile-wide{grid-column:span 2}

/* MSG */
.msg{text-align:center;padding:40px 16px;color:var(--mu);font-size:.95rem;animation:up .4s ease}
.spin{display:inline-block;width:24px;height:24px;border:3px solid var(--bd);border-top-color:var(--ac);border-radius:50%;animation:sp .7s linear infinite;margin-bottom:10px}
@keyframes sp{to{transform:rotate(360deg)}}
.upd{text-align:center;font-size:.74rem;color:var(--mu);padding:2px 0}

footer{width:100%;max-width:520px;text-align:center;padding:14px 12px 22px;font-size:.78rem;color:var(--mu);border-top:1px solid var(--bd);margin-top:6px}
footer strong{color:var(--ac)}
</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<body>
<div id="ob">⚡ OFFLINE</div>
<header>
  <div class="logo"> Velora</div>
  <div class="hrow">
    <button class="btn" id="ub" onclick="toggleF()">°C</button>
    <button class="btn" onclick="goToMyLocation()" title="Back to my current location">📍 Me</button>
    <button class="btn" id="sensbtn" onclick="toggleSensitiveMode()" title="Stricter AQI/UV thresholds for sensitive groups">🩺 Sensitive</button>
    <button class="btn" onclick="enterAmbientMode()" title="Dim always-on display mode">🌙 Ambient</button>
    <button class="btn" onclick="doRefresh()">↻</button>
    <button class="btn" id="impbtn" onclick="toggleImperial()" title="Toggle metric/imperial">MI</button>
    <button class="themewheel" title="Theme">
      <svg viewBox="0 0 40 40" width="34" height="34">
        <path id="wedge-dark" d="M20,20 L20,2 A18,18 0 0,1 38,20 Z" fill="#141720" onclick="setT('dark')"><title>Dark</title></path>
        <path id="wedge-light" d="M20,20 L38,20 A18,18 0 0,1 20,38 Z" fill="#eef1fa" onclick="setT('light')"><title>Light</title></path>
        <path id="wedge-oled" d="M20,20 L20,38 A18,18 0 0,1 2,20 Z" fill="#000000" onclick="setT('oled')"><title>OLED</title></path>
        <path id="wedge-hc" d="M20,20 L2,20 A18,18 0 0,1 20,2 Z" fill="#00ffff" onclick="setT('hc')"><title>High Contrast</title></path>
      </svg>
    </button>
  </div>
</header>
<main>
  <div class="swrap">
    <div class="srow">
      <input id="ci" type="text" placeholder="Search city…" autocomplete="off" oninput="onInp(this.value)" onkeydown="if(event.key==='Enter'){hideSug();doFetch()}if(event.key==='Escape')hideSug()">
      <button onclick="doFetch()">GO</button>
    </div>
    <div id="sug"></div>
  </div>
  <div id="favrow" class="favrow"></div>
  <div id="locBanner" class="locbanner" style="display:none"></div>
  <div id="alertsBox"></div>
  <div id="out"><div class="msg"><div class="spin"></div><br>Loading weather…</div></div>
  <div id="upd" class="upd"></div>
</main>
<div id="shakeHint">📳 Refreshing…</div>
<footer>© <strong>Manik Roy</strong> <span id="yr"></span> · All Rights Reserved</footer>

<script>
// ── INIT ─────────────────────────────────────────────────────────────
document.getElementById('yr').textContent = new Date().getFullYear();
const TH=['dark','light','oled','hc'];
function setT(t){
  document.documentElement.setAttribute('data-theme',t);
  TH.forEach(x=>document.getElementById('wedge-'+x)?.classList.remove('active'));
  document.getElementById('wedge-'+t)?.classList.add('active');
  localStorage.setItem('vtheme',t);
}
setT(localStorage.getItem('vtheme')||'dark');
let useF=localStorage.getItem('vunit')==='F';
const C2F=c=>Math.round(c*9/5+32);
const tF=c=>useF?`${C2F(c)}°F`:`${Math.round(c)}°C`;
const tS=c=>useF?`${C2F(c)}°`:`${Math.round(c)}°`;
function toggleF(){useF=!useF;localStorage.setItem('vunit',useF?'F':'C');const b=document.getElementById('ub');b.textContent=useF?'°F':'°C';b.classList.toggle('uf',useF);if(LD)render(...LD);}
if(useF){document.getElementById('ub').textContent='°F';document.getElementById('ub').classList.add('uf');}
let LD=null;

// ── OFFLINE ───────────────────────────────────────────────────────────
const chkNet=()=>document.getElementById('ob').style.display=navigator.onLine?'none':'block';
window.addEventListener('online',()=>{chkNet();doRefresh();});
window.addEventListener('offline',chkNet);
chkNet();

// ── PULL TO REFRESH ───────────────────────────────────────────────────
let ptY=0;
document.addEventListener('touchstart',e=>{if(window.scrollY<=5)ptY=e.touches[0].clientY;},{passive:true});
document.addEventListener('touchend',e=>{if(ptY&&e.changedTouches[0].clientY-ptY>60)doRefresh();ptY=0;});

// ── FAVOURITES ────────────────────────────────────────────────────────
const gF=()=>{try{return JSON.parse(localStorage.getItem('vfavs')||'[]');}catch{return[];}};
const sF=f=>localStorage.setItem('vfavs',JSON.stringify(f));
function renderFavs(){
  const f=gF(),r=document.getElementById('favrow');

// ── GEOCODING (city name → lat/lon) ─────────────────────────────────
// Open-Meteo's geocoding-api is primary; if it's unreachable/blocked/rate-limited
// (a different host than the forecast/air-quality APIs, so it can fail independently),
// fall back to Nominatim so search still works.
async function geocodeCity(query, limit = 6) {
  try {
    const d = await fT(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=${limit}`, 5000);
    if (d.results?.length) {
      return d.results.map(r => ({ name: r.name, admin1: r.admin1 || '', country_code: r.country_code || '', lat: r.latitude, lon: r.longitude }));
    }
  } catch {}
  try {
    const d = await fT(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&addressdetails=1&limit=${limit}`, 6000, false);
    if (Array.isArray(d) && d.length) {
      return d.map(r => {
        const a = r.address || {};
        return {
          name: a.city || a.town || a.village || a.county || (r.display_name ? r.display_name.split(',')[0] : query),
          admin1: a.state || '',
          country_code: (a.country_code || '').toUpperCase(),
          lat: +r.lat, lon: +r.lon
        };
      });
    }
  } catch {}
  return [];
}

function fT(url,ms=8000,strictOk=true){const c=new AbortController();const t=setTimeout(()=>c.abort(),ms);return fetch(url,{signal:c.signal}).finally(()=>clearTimeout(t)).then(r=>{if(strictOk&&!r.ok)throw new Error(`HTTP ${r.status}`);return r.json();});}

function moonPhase(){const d=new Date(),ref=new Date('2000-01-06'),diff=(d-ref)/86400000,cyc=diff%29.53;const p=cyc/29.53;const n=p<=.03||p>.97?'🌑 New Moon':p<=.22?'🌒 Waxing Crescent':p<=.28?'🌓 First Quarter':p<=.47?'🌔 Waxing Gibbous':p<=.53?'🌕 Full Moon':p<=.72?'🌖 Waning Gibbous':p<=.78?'🌗 Last Quarter':'🌘 Waning Crescent';return{n,pct:Math.round(Math.abs(.5-p)*200)};}

// ── ALLERGY INDEX (computed from weather, no broken API dep) ──────────
function allergyIndex(temp,hum,wind,code,dew){
  // Rain washes pollen out → very low
  if([61,63,65,80,81,82,95,96,99].includes(code))return{score:0,pct:0,label:'Very Low',sub:'Rain clearing air',color:'#5ec97a',tip:'Rain is washing pollen away. Low allergy risk today.'};
  // Fog also low
  if([45,48].includes(code))return{score:1,pct:10,label:'Low',sub:'Foggy conditions',color:'#5ec97a',tip:'Foggy weather suppresses pollen dispersal.'};
  // Snow = no pollen
  if([71,73,75,77,85,86].includes(code))return{score:0,pct:0,label:'None',sub:'Snow season',color:'#5ec97a',tip:'No pollen active during snow.'};
  // Compute score from multiple real weather factors
  let s=0;
  // Temperature: pollen peaks 15–25°C
  if(temp>=10&&temp<=30) s+=3; else if(temp>30) s+=2; else s+=0;
  // Low humidity = more airborne pollen
  if(hum<40) s+=3; else if(hum<60) s+=2; else if(hum<75) s+=1;
  // Moderate wind disperses pollen
  if(wind>=10&&wind<=30) s+=3; else if(wind>30) s+=1; else if(wind<10) s+=1;
  // Dew point: dry air = more pollen
  if(dew<5) s+=1;
  // Clear/sunny days = more pollen
  if([0,1].includes(code)) s+=1;
  s=Math.min(10,s);
  const p=s*10;
  if(s<=2)return{score:s,pct:p,label:'Low',sub:'Minimal pollen',color:'#5ec97a',tip:'Low allergy risk. Most people can enjoy outdoors freely.'};
  if(s<=4)return{score:s,pct:p,label:'Moderate',sub:'Some pollen active',color:'#aed561',tip:'Moderate pollen. Consider antihistamines if sensitive.'};
  if(s<=6)return{score:s,pct:p,label:'High',sub:'Significant pollen',color:'#f0c040',tip:'High pollen. Keep windows closed, shower after outdoors.'};
  if(s<=8)return{score:s,pct:p,label:'Very High',sub:'Heavy pollen dispersal',color:'#f08040',tip:'Very high pollen. Limit outdoor time, take medication.'};
  return{score:s,pct:p,label:'Extreme',sub:'Peak pollen season',color:'#e85555',tip:'Extreme pollen. Stay indoors, wear a mask outside.'};
}


// ── FEATURE 3: Feels-Like Sparkline (SVG) ──────────────────────────
function sparklineSVG(vals,color,showLabels=true){
  if(!vals||vals.length<2)return'';
  const w=300,h=48,pad=16;
  const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
  const pts=vals.map((v,i)=>{
    const x=pad+(i/(vals.length-1))*(w-pad*2);
    const y=h-pad-(((v-mn)/rng)*(h-pad*2));
    return[x,y];
  });
  const poly=pts.map(p=>p.join(',')).join(' ');
  const first=pts[0],last=pts[pts.length-1];
  const mid=pts[Math.floor(pts.length/2)];
  return`<svg class="spark-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
    <polyline points="${poly}" stroke="${color}" opacity=".9"/>
    ${showLabels?`<text x="${first[0]}" y="${first[1]-4}" text-anchor="middle">${Math.round(vals[0])}°</text>
    <text x="${mid[0]}" y="${mid[1]-4}" text-anchor="middle">${Math.round(vals[Math.floor(vals.length/2)])}°</text>
    <text x="${last[0]}" y="${last[1]-4}" text-anchor="middle">${Math.round(vals[vals.length-1])}°</text>`:''}
  </svg>`;
}

// ── FEATURE 8: Breathing Quality Index ──────────────────────────────
function breathingQuality(aqi,hum,temp,code){
  let s=10;
  if(aqi>200)s-=5;else if(aqi>150)s-=4;else if(aqi>100)s-=3;else if(aqi>50)s-=1;
  if(hum>80)s-=2;else if(hum>70)s-=1;
  if(temp>35)s-=2;else if(temp<-5)s-=1;
  if([45,48].includes(code))s-=1;
  if([95,96,99].includes(code))s-=1;
  s=Math.min(10,Math.max(0,Math.round(s)));

  if(s>=2)return{s,l:'Poor',c:'#f08040',tip:'Limit prolonged outdoor exertion.'};
  return{s,l:'Very Poor',c:'#e85555',tip:'Stay indoors. Keep windows closed.'};
}

// ── FEATURE 6: Hydration Reminder Score ─────────────────────────────
function hydrationScore(temp,hum,uv,wind,code){
  // Base: 8 glasses/day. Add extra based on conditions.
  let extra=0;
  if(temp>=30)extra+=3;else if(temp>=25)extra+=2;else if(temp>=20)extra+=1;
  if(hum<30)extra+=2;else if(hum<50)extra+=1;
  if(uv>=8)extra+=2;else if(uv>=5)extra+=1;
  if(wind>30)extra+=1;
  if([95,96,99,80,81,82].includes(code))extra+=1;
  const total=8+extra;
  const c=extra<=0?'#5ec97a':extra<=2?'#f0c040':extra<=4?'#f08040':'#e85555';
  const l=extra<=0?'Normal':'Drink More';
  const tip=extra<=0?`Drink your usual 8 glasses today.`:`Drink ~${total} glasses today. Heat & UV increase fluid loss.`;
  return{extra,total,c,l,tip};
}

// ── FEATURE 10: Cold & Flu Risk ──────────────────────────────────────
function coldFluRisk(temp,hum,wind,code){
  let s=0;
  // Cold temps help viruses survive
  if(temp<5)s+=4;else if(temp<10)s+=3;else if(temp<15)s+=2;else if(temp<20)s+=1;
  // Low humidity = virus stays airborne longer
  if(hum<30)s+=3;else if(hum<50)s+=2;else if(hum<65)s+=1;
  // Wind increases exposure
  if(wind>20)s+=1;
  // Rain/cold combo = people stay indoors in groups
  if([61,63,65,80,81].includes(code))s+=1;
  s=Math.min(10,s);
  if(s<=2)return{s,l:'Low',c:'#5ec97a',tip:'Low virus survival conditions.'};

  if(s<=7)return{s,l:'High',c:'#f08040',tip:'Peak cold & flu weather. Boost immunity.'};
  return{s,l:'Very High',c:'#e85555',tip:'High risk. Avoid crowded indoor spaces.'};
}

// ── FEATURE 15: Lightning Risk (CAPE proxy) ──────────────────────────
function lightningRisk(temp,dew,pressure,code){
  // CAPE proxy: temperature-dewpoint spread and instability
  const spread=temp-dew; // small spread = more moisture = more instability
  let s=0;
  if([95,96,99].includes(code))return{s:10,l:'Active Storm',c:'#e85555',tip:'Lightning active. Stay indoors away from windows.'};
  if([80,81,82].includes(code))s+=3;
  if(spread<5)s+=3;else if(spread<10)s+=2;else if(spread<15)s+=1;
  if(temp>28)s+=2;else if(temp>22)s+=1;
  if(pressure<1005)s+=2;else if(pressure<1010)s+=1;
  s=Math.min(10,s);
  if(s<=2)return{s,l:'Very Low',c:'#5ec97a',tip:'Atmosphere stable. No lightning risk.'};
  if(s<=4)return{s,l:'Low',c:'#aed561',tip:'Minimal instability. Low lightning chance.'};
  if(s<=6)return{s,l:'Moderate',c:'#f0c040',tip:'Some instability. Watch for developing storms.'};
  if(s<=8)return{s,l:'High',c:'#f08040',tip:'Unstable atmosphere. Seek shelter if outdoors.'};
  return{s,l:'Extreme',c:'#e85555',tip:'Severe instability. Stay indoors. Unplug electronics.'};
}

// ── FEATURE 5: Thunderstorm Proximity ───────────────────────────────
function stormProximity(code,pressure,pressTrend,wind,code24){
  const activeNow=[95,96,99].includes(code);
  const approaching=!activeNow&&pressTrend<-1&&wind>15&&code24;
  const possible=!activeNow&&!approaching&&(pressure<1005||[80,81,82].includes(code));
  if(activeNow)return{l:'⚡ Storm Active',c:'#e85555',sub:'Take shelter immediately',show:true};
  if(approaching)return{l:'⚠️ Storm Approaching',c:'#f08040',sub:`Pressure dropping ${Math.abs(pressTrend).toFixed(1)} hPa/hr`,show:true};
  if(possible)return{l:'🌩️ Storm Possible',c:'#f0c040',sub:'Unstable conditions developing',show:true};
  return{l:'Clear',c:'#5ec97a',sub:'No storm threat',show:false};
}

// ── FEATURE 17: Rain Trend ───────────────────────────────────────────
function rainTrend(precipArr){
  if(!precipArr||precipArr.length<4)return{t:'Unknown',icon:'❓',c:'var(--mu)'};
  const vals=precipArr.slice(0,8).map(Number);
  const first=vals.slice(0,4).reduce((a,b)=>a+b,0);
  const second=vals.slice(4,8).reduce((a,b)=>a+b,0);
  const diff=second-first;
  if(vals.every(v=>v===0))return{t:'No Rain Expected',icon:'☀️',c:'#5ec97a'};
  if(diff>1)return{t:'Rain Increasing',icon:'📈',c:'#1a8fd1'};
  if(diff<-1)return{t:'Rain Decreasing',icon:'📉',c:'#aed561'};
  if(first>0||second>0)return{t:'Rain Steady',icon:'〰️',c:'#4db8f0'};
  return{t:'Clearing',icon:'🌤️',c:'#5ec97a'};
}


// ── FEATURE 16: Local City Time ─────────────────────────────────────
function cityTime(tzOffset){
  // Open-Meteo returns utc_offset_seconds in wd.utc_offset_seconds
  const utcMs=Date.now()+(new Date().getTimezoneOffset()*60000);
  const cityMs=utcMs+(tzOffset||0)*1000;
  const d=new Date(cityMs);
  const h=d.getUTCHours()%12||12,m=String(d.getUTCMinutes()).padStart(2,'0'),a=d.getUTCHours()>=12?'PM':'AM';
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return`${days[d.getUTCDay()]} ${h}:${m} ${a}`;
}

// ── FEATURE 11: Twilight Times ───────────────────────────────────────
function twilightTimes(rise,set){
  if(!rise||!set)return null;
  const r=new Date(rise),s=new Date(set);
  const fmt=d=>{const h=d.getHours()%12||12,m=String(d.getMinutes()).padStart(2,'0'),a=d.getHours()>=12?'PM':'AM';return`${h}:${m}${a}`;};
  // Civil: 6° below horizon (~30 min before/after)
  // Nautical: 12° below (~60 min)
  // Astronomical: 18° below (~90 min)
  return{
    astroDawn: fmt(new Date(r.getTime()-90*60000)),
    nautDawn:  fmt(new Date(r.getTime()-60*60000)),
    civilDawn: fmt(new Date(r.getTime()-30*60000)),
    sunrise:   fmt(r),
    sunset:    fmt(s),
    civilDusk: fmt(new Date(s.getTime()+30*60000)),
    nautDusk:  fmt(new Date(s.getTime()+60*60000)),
    astroDusk: fmt(new Date(s.getTime()+90*60000)),
  };
}

}

// ── NEW: Dog Walk Advisor — pavement heat + best walk window ─────────
function dogWalkAdvisor(temp,uv,sH,sT){
  // Rough pavement-surface estimate: asphalt runs ~15-20°C hotter than air on a sunny day
  const pavementEst=Math.round(temp+(uv>=6?16:uv>=3?9:3));
  const paw=pavementEst>=52?{l:'Dangerous',c:'#e85555',tip:'Too hot for paws — asphalt can burn. Walk on grass or wait for cooler hours.'}
    :pavementEst>=42?{l:'Caution',c:'#f08040',tip:'Test pavement with your hand for 7s — if too hot for you, it\u2019s too hot for paws.'}
    :{l:'Safe',c:'#5ec97a',tip:'Pavement temperature looks fine for paws.'};
  // Find the coolest daylight hour in the next 12h as the suggested walk time
  let bi=0,bt=Infinity;
  for(let i=0;i<sT.length;i++){if(Number(sT[i])<bt){bt=Number(sT[i]);bi=i;}}
  return{pavementEst,paw,bestHour:sH?.[bi]};
}

// ── NEW: Kite & Wind Sports Index ─────────────────────────────────────
function kiteWindIndex(wind,gust){
  const g=gust??wind*1.3;
  const gustiness=wind>0?(g-wind)/wind:0;
  let l,c,tip;
  if(wind<8){l='Too Calm';c='#6b75a8';tip='Not enough wind to get a kite up reliably.';}
  else if(wind<=28&&gustiness<0.5){l='Great';c='#5ec97a';tip='Steady wind in a great range for kites, sailing, or windsurfing.';}
  else if(wind<=35){l='Strong';c='#f0c040';tip='Solid wind but powerful — fine for experienced flyers/sailors.';}
  else{l='Too Gusty/Strong';c='#e85555';tip='Wind is too strong or unstable for most wind sports today.';}
  return{l,c,tip,gust:Math.round(g)};
}

// ── NEW: Solar Output Estimate — rough panel yield potential ─────────
function solarOutputEstimate(uv,cloudPct,daylightHrs){
  const clearFactor=1-(cloudPct/100)*0.75;
  const kwhPerM2=Math.max(0,(uv/11)*5.5*clearFactor*(daylightHrs/12));
  const pct=Math.min(100,Math.round((kwhPerM2/6)*100));
  const l=pct>=75?'Excellent':pct>=50?'Good':pct>=25?'Fair':'Poor';
  const c=pct>=75?'#5ec97a':pct>=50?'#aed561':pct>=25?'#f0c040':'#e85555';
  return{kwh:kwhPerM2.toFixed(1),pct,l,c};
}

// ── NEW: Mosquito & Bug Activity Index ────────────────────────────────
function mosquitoActivity(temp,hum,isDay){
  let s=0;
  if(temp>=20&&temp<=32)s+=4;else if(temp>=15&&temp<35)s+=2;
  if(hum>=60)s+=3;else if(hum>=45)s+=1;
  if(!isDay)s+=3; // dawn/dusk/night — peak mosquito activity
  s=Math.min(10,s);
  if(s<=2)return{s,l:'Low',c:'#5ec97a',tip:'Low bug activity expected.'};
  if(s<=5)return{s,l:'Moderate',c:'#f0c040',tip:'Some activity — repellent recommended at dusk.'};
  if(s<=7)return{s,l:'High',c:'#f08040',tip:'High mosquito activity. Use repellent outdoors.'};
  return{s,l:'Very High',c:'#e85555',tip:'Peak conditions for mosquitoes — cover up and use repellent.'};
}

// ── NEW: Static Shock / Dry Skin Risk ─────────────────────────────────
function staticShockRisk(temp,hum){
  if(hum<30&&temp<18)return{l:'High',c:'#e85555',tip:'Cold, dry air — expect static shocks and dry skin. Use a humidifier/moisturizer.'};
  if(hum<40)return{l:'Moderate',c:'#f0c040',tip:'Dry air. Static and skin dryness possible.'};
  return{l:'Low',c:'#5ec97a',tip:'Humidity is comfortable — low static risk.'};
}

// ── NEW: Contact Lens / Dry Eye Alert ─────────────────────────────────
function dryEyeRisk(hum,wind){
  const s=(hum<35?2:hum<50?1:0)+(wind>25?2:wind>15?1:0);
  if(s>=3)return{l:'High',c:'#e85555',tip:'Low humidity + wind — bring lubricating drops if you wear contacts.'};
  if(s>=1)return{l:'Moderate',c:'#f0c040',tip:'Conditions may dry out contacts/eyes over time.'};
  return{l:'Low',c:'#5ec97a',tip:'Comfortable conditions for contact lens wearers.'};
}

// ── NEW: Flash Flood Risk — heavy near-term rain + saturated-ground proxy ──
function flashFloodRisk(hourlyPrecip,todayPrecipSum,code){
  const next6h=(hourlyPrecip||[]).slice(0,6).reduce((a,b)=>a+Number(b||0),0);
  let s=0;
  if(next6h>=30)s+=5;else if(next6h>=15)s+=3;else if(next6h>=8)s+=1;
  if(todayPrecipSum>=50)s+=3;else if(todayPrecipSum>=25)s+=1;
  if([65,82,95,96,99].includes(code))s+=2;
  s=Math.min(10,s);
  if(s<=2)return{s,l:'Low',c:'#5ec97a',tip:'No significant flash flood signal right now.'};
  if(s<=4)return{s,l:'Watch',c:'#f0c040',tip:'Heavy rain possible — avoid low-lying areas if it intensifies.'};
  if(s<=7)return{s,l:'Elevated',c:'#f08040',tip:'Ground may saturate quickly. Avoid flood-prone roads and underpasses.'};
  return{s,l:'High',c:'#e85555',tip:'Flash flooding is plausible. Avoid low-lying areas and never drive through flooded roads.'};
}

// ── NEW: Wildfire Smoke Risk — PM2.5-dominant pollution profile proxy ──
function smokeRisk(pm25,pm10,visKm){
  const ratio=pm10>0?pm25/pm10:0; // smoke skews toward fine particulates
  let s=0;
  if(pm25>=150)s+=5;else if(pm25>=55)s+=3;else if(pm25>=35)s+=1;
  if(ratio>=0.7)s+=3;else if(ratio>=0.5)s+=1;
  if(visKm<5)s+=2;
  s=Math.min(10,s);
  if(s<=2)return{s,l:'Low',c:'#5ec97a',tip:'No smoke signature in current air quality data.'};
  if(s<=4)return{s,l:'Possible',c:'#f0c040',tip:'Fine-particulate profile suggests some smoke may be present.'};
  if(s<=7)return{s,l:'Likely',c:'#f08040',tip:'Air quality pattern is consistent with wildfire smoke. Limit outdoor exertion.'};
  return{s,l:'Heavy',c:'#e85555',tip:'Strong smoke signature. Stay indoors with windows closed if possible.'};
}

// ── NEW: Weekly Comfort Ranking — every day scored & ranked, not just one star
function weeklyComfortRanking(d){
  const scored=d.time.map((t,i)=>{
    const tmax=d.temperature_2m_max[i];
    const precip=Number(d.precipitation_probability_max?.[i]??0);
    const uvMax=Number(d.uv_index_max?.[i]??0);
    const badWx=[45,48,51,53,55,61,63,65,71,73,75,77,80,81,82,95,96,99].includes(d.weather_code[i]);
    const tempScore=10-Math.abs(tmax-24)*0.4;
    const score=tempScore-(precip*0.12)-(badWx?3:0)-(uvMax>8?1:0);
    return{i,t,score};
  });
  return scored.slice().sort((a,b)=>b.score-a.score);
}

// Uses Open-Meteo's multi-location support (comma-separated lat/lon returns
// an array of results in one request) against a curated list of major cities
// spanning many climates, so this is one network call, not dozens.
const TWIN_CITIES=[
  {n:'Reykjavik, IS',lat:64.15,lon:-21.94},{n:'Oslo, NO',lat:59.91,lon:10.75},
  {n:'Moscow, RU',lat:55.76,lon:37.62},{n:'London, GB',lat:51.51,lon:-0.13},

  {n:'Toronto, CA',lat:43.65,lon:-79.38},{n:'Istanbul, TR',lat:41.01,lon:28.98},
  {n:'Tokyo, JP',lat:35.68,lon:139.65},{n:'Beijing, CN',lat:39.9,lon:116.41},
  {n:'Seoul, KR',lat:37.57,lon:126.98},{n:'Delhi, IN',lat:28.61,lon:77.21},
  {n:'Kolkata, IN',lat:22.57,lon:88.36},{n:'Mumbai, IN',lat:19.08,lon:72.88},
  {n:'Dubai, AE',lat:25.2,lon:55.27},{n:'Cairo, EG',lat:30.04,lon:31.24},
  {n:'Riyadh, SA',lat:24.71,lon:46.68},{n:'Lagos, NG',lat:6.52,lon:3.38},
  {n:'Nairobi, KE',lat:-1.29,lon:36.82},{n:'Cape Town, ZA',lat:-33.92,lon:18.42},
  {n:'Bangkok, TH',lat:13.76,lon:100.5},{n:'Singapore, SG',lat:1.35,lon:103.82},
  {n:'Jakarta, ID',lat:-6.21,lon:106.85},{n:'Manila, PH',lat:14.6,lon:120.98},
  {n:'Sydney, AU',lat:-33.87,lon:151.21},{n:'Perth, AU',lat:-31.95,lon:115.86},
  {n:'Auckland, NZ',lat:-36.85,lon:174.76},{n:'Sao Paulo, BR',lat:-23.55,lon:-46.63},
  {n:'Buenos Aires, AR',lat:-34.6,lon:-58.38},{n:'Lima, PE',lat:-12.05,lon:-77.04},
  {n:'Mexico City, MX',lat:19.43,lon:-99.13},{n:'Los Angeles, US',lat:34.05,lon:-118.24},
  {n:'Anchorage, US',lat:61.22,lon:-149.9},{n:'Denver, US',lat:39.74,lon:-104.99},
  {n:'Vancouver, CA',lat:49.28,lon:-123.12},{n:'Madrid, ES',lat:40.42,lon:-3.7},
  {n:'Rome, IT',lat:41.9,lon:12.5},{n:'Athens, GR',lat:37.98,lon:23.73}
];
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,dLat=(lat2-lat1)*Math.PI/180,dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
async function findWeatherTwin(curLat,curLon,curTemp,curHum,curCode){
  const candidates=TWIN_CITIES.filter(ct=>haversineKm(curLat,curLon,ct.lat,ct.lon)>300);
  if(!candidates.length)return null;
  const lats=candidates.map(c=>c.lat).join(','),lons=candidates.map(c=>c.lon).join(',');
  const data=await fT(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,relative_humidity_2m,weather_code&timezone=auto`,8000,false);
  const arr=Array.isArray(data)?data:[data];
  let best=null,bestDiff=Infinity;
  arr.forEach((r,i)=>{
    if(!r?.current||!candidates[i])return;
    const tempDiff=Math.abs(r.current.temperature_2m-curTemp);
    const humDiff=Math.abs((r.current.relative_humidity_2m??50)-curHum)/8;
    const codeDiff=r.current.weather_code===curCode?0:2.5;
    const diff=tempDiff+humDiff+codeDiff;
    if(diff<bestDiff){bestDiff=diff;best={...candidates[i],temp:r.current.temperature_2m,hum:r.current.relative_humidity_2m,code:r.current.weather_code};}
  });
  return best;
}
let twinCache={key:null,html:''};
async function updateWeatherTwin(lat,lon,temp,hum,code){
  const el=document.getElementById('twinBody');
  if(!el)return;
  const key=`${lat.toFixed(1)},${lon.toFixed(1)},${Math.round(temp)},${code}`;
  if(twinCache.key===key){el.innerHTML=twinCache.html;return;}
  try{
    const twin=await findWeatherTwin(lat,lon,temp,hum,code);
    const el2=document.getElementById('twinBody'); // re-fetch in case DOM re-rendered mid-flight
    if(!el2)return;
    if(!twin){el2.innerHTML='No close weather match found right now.';return;}
    const html=`<div style="display:flex;align-items:center;gap:12px"><div style="font-size:2rem">${WI[twin.code]||'🌡️'}</div><div><div style="font-weight:700;font-size:.95rem">${twin.n}</div><div style="font-size:.78rem;color:var(--mu);margin-top:2px">${useF?C2F(twin.temp):Math.round(twin.temp)}${useF?'°F':'°C'} · ${twin.hum}% humidity · ${WD[twin.code]||''}</div></div></div>`;
    twinCache={key,html};
    el2.innerHTML=html;
  }catch{
    const el3=document.getElementById('twinBody');
    if(el3)el3.innerHTML='Could not find a weather twin right now.';
  }
}

// Velora's own computed risk signals (buildAlertsFeed, below) cover that.
let dismissedAlerts=new Set(JSON.parse(localStorage.getItem('vdismissedAlerts')||'[]'));

async function loadSevereAlerts(lat,lon){
  const box=document.getElementById('alertsBox');
  if(!box)return;
  try{
    const data=await fT(`https://api.weather.gov/alerts/active?point=${lat.toFixed(4)},${lon.toFixed(4)}`,7000,false);
    const feats=(data?.features||[]).filter(f=>!dismissedAlerts.has(f.id));
    if(!feats.length){box.innerHTML='';return;}
    box.innerHTML=feats.slice(0,4).map(f=>{
      const p=f.properties||{};
      const sev=(p.severity||'').toLowerCase();
      const cls=sev==='severe'||sev==='extreme'?'':'severity-moderate';
      return`<div class="alert-card ${cls}">
        <div class="alh"><span>⚠️ ${p.event||'Weather Alert'}</span><button class="alx" onclick="dismissAlert('${f.id}')">Dismiss</button></div>

      </div>`;
    }).join('');
  }catch{
    box.innerHTML=''; // non-US location or NWS unreachable — fail silently
  }
}
function dismissAlert(id){

// ── NEW: Alerts Feed — aggregates the app's own computed risk signals into
// a single alert list. Note: this is NOT an official government warning feed
// (no free, global, no-key alert API exists) — it's Velora's own analysis of
// current conditions, clearly labeled as such.
function buildAlertsFeed(signals){
  const items=[];
  if(signals.storm?.show&&signals.storm.l.includes('Active'))items.push({lvl:'severe',ico:'⚡',t:'Active Storm',m:signals.storm.sub});
  else if(signals.storm?.show)items.push({lvl:'warn',ico:'🌩️',t:signals.storm.l,m:signals.storm.sub});
  if(signals.flashFlood?.s>=6)items.push({lvl:'severe',ico:'🌊',t:'Flash Flood Risk: '+signals.flashFlood.l,m:signals.flashFlood.tip});
  else if(signals.flashFlood?.s>=4)items.push({lvl:'warn',ico:'🌊',t:'Flash Flood Watch: '+signals.flashFlood.l,m:signals.flashFlood.tip});
  if(signals.smoke?.s>=6)items.push({lvl:'severe',ico:'🔥',t:'Wildfire Smoke: '+signals.smoke.l,m:signals.smoke.tip});
  else if(signals.smoke?.s>=4)items.push({lvl:'warn',ico:'🔥',t:'Smoke Advisory: '+signals.smoke.l,m:signals.smoke.tip});
  if(signals.heatRisk>=8)items.push({lvl:'severe',ico:'🌡️',t:'Extreme Heat',m:'Heat stroke risk is extreme today. Stay hydrated and avoid peak sun.'});
  if(signals.aqi>200)items.push({lvl:'severe',ico:'😷',t:'Hazardous Air Quality',m:`AQI ${signals.aqi} — avoid outdoor exposure.`});
  else if(signals.aqi>150)items.push({lvl:'warn',ico:'😷',t:'Unhealthy Air Quality',m:`AQI ${signals.aqi} — sensitive groups should stay indoors.`});
  if(signals.uv>=10)items.push({lvl:'warn',ico:'🕶️',t:'Extreme UV',m:'UV index is extreme — minimize sun exposure between 10am–4pm.'});
  if(signals.wind>=50)items.push({lvl:'warn',ico:'💨',t:'High Wind',m:`Sustained wind near ${Math.round(signals.wind)} km/h — secure loose objects.`});
  if(!items.length)items.push({lvl:'ok',ico:'✅',t:'No Active Alerts',m:'Conditions look normal right now.'});
  return items;
}

// ── NEW: Custom Alert Rules + Push Notifications ──────────────────────
function getAlertRules(){try{return JSON.parse(localStorage.getItem('vrules')||'[]');}catch{return[];}}
function saveAlertRules(r){localStorage.setItem('vrules',JSON.stringify(r));}
async function requestNotifyPermission(){
  if(!('Notification' in window))return'unsupported';
  if(Notification.permission==='granted')return'granted';
  if(Notification.permission==='denied')return'denied';
  try{return await Notification.requestPermission();}catch{return'denied';}
}
function fireLocalNotification(title,body){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  try{
    if(navigator.serviceWorker?.controller){
      navigator.serviceWorker.ready.then(reg=>reg.showNotification(title,{body,icon:'./icons/icon-192x192.png',badge:'./icons/favicon-32x32.png'}));
    }else{
      new Notification(title,{body,icon:'./icons/icon-192x192.png'});
    }
  }catch{}
}
const METRIC_LABELS={temp:'Temperature (°C)',rain:'Rain Chance (%)',aqi:'AQI',uv:'UV Index',wind:'Wind (km/h)'};
function evalRule(rule,c,d,aqi,todayIdx){
  const vals={temp:c.temperature_2m,rain:Number(d.precipitation_probability_max?.[todayIdx]??0),aqi,uv:c.uv_index??0,wind:c.wind_speed_10m};
  const v=vals[rule.metric];
  if(v==null)return false;
  return rule.op==='>'?v>rule.value:v<rule.value;
}
function checkCustomAlerts(c,d,aqi,todayIdx){
  if(Notification?.permission!=='granted')return;
  const rules=getAlertRules();
  const today=new Date().toDateString();
  let firedLog={};try{firedLog=JSON.parse(localStorage.getItem('vfired')||'{}');}catch{}
  rules.forEach((rule,i)=>{
    if(evalRule(rule,c,d,aqi,todayIdx)){
      const key=`${i}-${today}`;
      if(!firedLog[key]){
        fireLocalNotification('Velora Alert',`${METRIC_LABELS[rule.metric]} is ${rule.op} ${rule.value} right now.`);
        firedLog[key]=true;
      }
    }
  });
  try{localStorage.setItem('vfired',JSON.stringify(firedLog));}catch{}
}
function addAlertRule(metric,op,value){
  const rules=getAlertRules();
  rules.push({metric,op,value:Number(value)});
  saveAlertRules(rules);
  renderAlertRulesUI();
}
function removeAlertRule(i){
  const rules=getAlertRules();
  rules.splice(i,1);
  saveAlertRules(rules);
  renderAlertRulesUI();
}
async function enableCustomAlerts(){
  const perm=await requestNotifyPermission();
  const el=document.getElementById('rulesStatus');
  if(el)el.textContent=perm==='granted'?'✅ Notifications enabled':perm==='denied'?'❌ Notifications blocked — enable in browser settings':'Notifications unsupported in this browser';

function renderAlertRulesUI(){

let wxMap=null,wxBaseLayer=null,wxOverlay=null,wxMarkers=[],currentMapLayer='radar',mapCenterLat=0,mapCenterLon=0;

// Wind/heat use a sampled grid (real data points, not a dense field), since
// no free, no-key, global gridded wind/temperature tile service exists.
function buildGrid(lat,lon,steps,spacingDeg){
  const pts=[];
  for(let i=-steps;i<=steps;i++)for(let j=-steps;j<=steps;j++)pts.push({lat:lat+i*spacingDeg,lon:lon+j*spacingDeg});
  return pts;
}
async function loadWindLayer(){
  const note=document.getElementById('mapNote');
  try{
    const pts=buildGrid(mapCenterLat,mapCenterLon,2,1.5);
    const lats=pts.map(p=>p.lat).join(','),lons=pts.map(p=>p.lon).join(',');
    const data=await fT(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=wind_speed_10m,wind_direction_10m&timezone=auto`,8000,false);
    const arr=Array.isArray(data)?data:[data];
    arr.forEach((r,i)=>{
      if(!r?.current)return;
      const spd=r.current.wind_speed_10m,dir=r.current.wind_direction_10m;
      const icon=L.divIcon({className:'',html:`<div class="wind-arrow" style="transform:rotate(${dir}deg);color:${spd>30?'#e85555':spd>15?'#f0c040':'#4db8f0'}">↑</div>`,iconSize:[20,20]});
      wxMarkers.push(L.marker([pts[i].lat,pts[i].lon],{icon}).addTo(wxMap).bindTooltip(`${Math.round(spd)} km/h`));
    });
    if(note)note.textContent='Wind field sampled from a nearby grid of points — an approximation, not a dense flow model.';
  }catch{if(note)note.textContent='Could not load wind data right now.';}
}
async function loadHeatLayer(){
  const note=document.getElementById('mapNote');
  try{
    const pts=buildGrid(mapCenterLat,mapCenterLon,2,1.5);
    const lats=pts.map(p=>p.lat).join(','),lons=pts.map(p=>p.lon).join(',');
    const data=await fT(`https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m&timezone=auto`,8000,false);
    const arr=Array.isArray(data)?data:[data];
    const temps=arr.map(r=>r?.current?.temperature_2m).filter(t=>t!=null);
    const mn=Math.min(...temps),mx=Math.max(...temps)||mn+1;
    arr.forEach((r,i)=>{

      const pct=(t-mn)/((mx-mn)||1);
      const col=pct<.33?'#4db8f0':pct<.66?'#f0c040':'#e85555';
      wxMarkers.push(L.circleMarker([pts[i].lat,pts[i].lon],{radius:22,fillColor:col,fillOpacity:.45,color:col,weight:1}).addTo(wxMap).bindTooltip(`${Math.round(useF?C2F(t):t)}${useF?'°F':'°C'}`));
    });

  }catch{if(note)note.textContent='Could not load temperature data right now.';}
}

// ── FEATURE 6: Shake to Refresh ─────────────────────────────────────
function initShake(){
  if(!window.DeviceMotionEvent)return;
  let last=0,lx=0,ly=0,lz=0;
  const handler=e=>{
    const acc=e.accelerationIncludingGravity||e.acceleration;
    if(!acc)return;
    const now=Date.now();
    if(now-last<100)return;
    last=now;
    const dx=Math.abs((acc.x||0)-lx),dy=Math.abs((acc.y||0)-ly),dz=Math.abs((acc.z||0)-lz);
    lx=acc.x||0;ly=acc.y||0;lz=acc.z||0;
    if(dx+dy+dz>40){
      const hint=document.getElementById('shakeHint');
      if(hint){hint.style.opacity='1';setTimeout(()=>hint.style.opacity='0',1500);}
      doRefresh();
    }
  };
  // iOS 13+ needs permission
  if(typeof DeviceMotionEvent.requestPermission==='function'){
    // Add button to request
    const btn=document.createElement('button');
    btn.className='btn';btn.textContent='📳 Shake';btn.title='Enable shake to refresh';
    btn.onclick=()=>{DeviceMotionEvent.requestPermission().then(r=>{if(r==='granted'){window.addEventListener('devicemotion',handler);btn.remove();}});};
    document.querySelector('.hrow')?.prepend(btn);
  }else{
    window.addEventListener('devicemotion',handler,{passive:true});
  }
}

// ============================================================
// LOCATION — rewritten from scratch. GPS-only, no IP fallback.
// Everything about detecting "where is the user right now" lives here.
// ============================================================

// Checks the actual OS/browser permission state so the app can tell the
// user definitively why GPS isn't working, instead of guessing after a
// failed attempt. No website can override a blocked permission — this
// just lets the app explain it clearly.
async function geoPermissionState(){
  if(!navigator.permissions?.query)return'unknown';
  try{
    const status=await navigator.permissions.query({name:'geolocation'});
    return status.state; // 'granted' | 'denied' | 'prompt'
  }catch{return'unknown';}
}

// A single getCurrentPosition() call often returns a fast, coarse
// Wi-Fi/cell-based fix rather than a true satellite lock. This samples
// readings for up to `timeoutMs` and keeps the most precise one seen,
// exiting early the moment a good (<=30m) fix arrives.
// Devices without a real GPS chip (laptops, many tablets) can only ever get
// Wi-Fi/cell-based positioning, which rarely reaches high precision — so
// waiting for a single strict accuracy bar means every fix on those devices
// burns the full timeout AND still ends up mediocre. Instead this uses
// tiered thresholds: excellent fixes return instantly, good-enough fixes
// return once a minimum settle time has passed, and if accuracy plateaus
// (stops improving) it cuts losses early rather than waiting out the clock.
function getGpsFix(timeoutMs=10000,onProgress){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){
      reject(new Error('GPS is not supported by this browser.'));
      return;
    }
    let best=null,watchId=null,settled=false,lastImprovedAt=0;
    const start=Date.now();
    const finish=()=>{
      if(settled)return;
      settled=true;
      if(watchId!=null)navigator.geolocation.clearWatch(watchId);
      if(best)resolve(best);
      else reject(new Error('Could not get a GPS fix. Try again outdoors, or check that Location is enabled for this app/browser.'));
    };
    watchId=navigator.geolocation.watchPosition(
      pos=>{
        const accuracy=Math.round(pos.coords.accuracy??99999);
        const elapsed=Date.now()-start;
        if(!best||accuracy<best.accuracy){
          best={lat:pos.coords.latitude,lon:pos.coords.longitude,accuracy};
          lastImprovedAt=elapsed;
        }
        onProgress?.(best.accuracy);
        if(accuracy<=20)finish();                                   // excellent — stop immediately
        else if(accuracy<=100&&elapsed>=3000)finish();               // good enough after a brief settle
        else if(best&&elapsed>=4500&&elapsed-lastImprovedAt>=3000)finish(); // plateaued — more waiting won't help
      },
      err=>{
        if(best)return; // already have a usable fix — ignore late errors
        settled=true;
        if(watchId!=null)navigator.geolocation.clearWatch(watchId);
        const msgs={1:'Location permission denied. Enable it in your browser/app settings.',2:'GPS position unavailable. Try again outdoors or check your device\u2019s location settings.',3:'GPS request timed out. Try again.'};
        reject(new Error(msgs[err.code]||'Could not get GPS location.'));
      },
      {enableHighAccuracy:true,timeout:timeoutMs,maximumAge:0}
    );
    setTimeout(finish,timeoutMs);
  });
}

// Coordinates → readable place name.
async function coordsToName(lat,lon){
  try{
    const rev=await fT(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=12`,4000,false);
    const a=rev.address||{};
    const place=a.city||a.town||a.village||a.municipality||a.county||a.state||'Your Location';
    return`${place}, ${(a.country_code||'').toUpperCase()}`;
  }catch{return'Your Location';}
}

// Single entry point for "where is the user right now" — GPS fix, resolved
// to a display name. No IP fallback: if GPS fails, this throws and the
// caller shows a clear error instead of silently substituting a guess.
async function locateMe(onProgress){
  const fix=await getGpsFix(10000,onProgress);
  const name=await coordsToName(fix.lat,fix.lon);
  return{lat:fix.lat,lon:fix.lon,name,locMeta:{source:'gps',accuracy:fix.accuracy}};
}

async function retryLocation(){
  const state=await geoPermissionState();
  if(state==='denied'){
    locBanner(`📍 Still blocked. Location for this site is set to <strong>Blocked</strong> at the browser level — change it in your browser's site settings before retrying. Tap the site/lock icon next to the address bar → Permissions → Location → "Allow", then tap Retry.<br><button onclick="retryLocation()">🔄 Retry</button><button class="lb-dismiss" onclick="locBanner()">Dismiss</button>`);
    return;
  }
  locBanner();
  useGPS();
}
